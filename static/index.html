<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFBrain">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>AFBrain</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

:root {
  --bg-primary: #000000;
  --bg-secondary: #1c1c1e;
  --bg-tertiary: #2c2c2e;
  --separator: rgba(84,84,88,0.65);
  --red: #ff453a;
  --orange: #ff9f0a;
  --label: #ffffff;
  --label-secondary: rgba(235,235,245,0.6);
  --label-tertiary: rgba(235,235,245,0.3);
  --label-quaternary: rgba(235,235,245,0.16);
  --fill: rgba(120,120,128,0.36);
  --radius: 12px;
  --radius-lg: 16px;
  --sf: -apple-system, 'Helvetica Neue', sans-serif;
  --sf-mono: 'SF Mono', 'Menlo', monospace;
}

html {
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg-primary);
  color: var(--label);
  font-family: var(--sf);
  height: 100%;
  overflow: hidden;
  position: fixed;
  width: 100%;
  font-size: 17px;
  line-height: 1.47;
}

/* ── LOGIN ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: 0 24px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 40px;
}
.login-logo span { color: var(--red); }
.login-field {
  background: var(--bg-secondary);
  border: none;
  border-radius: var(--radius);
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  padding: 14px 16px;
  width: 100%;
  outline: none;
  margin-bottom: 12px;
  -webkit-appearance: none;
}
.login-field::placeholder { color: var(--label-tertiary); }
.login-btn {
  width: 100%;
  height: 50px;
  background: var(--red);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: var(--sf);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
  transition: opacity 0.15s;
}
.login-btn:active { opacity: 0.8; }
.login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ── MAIN LAYOUT ── */
#main-screen {
  display: none;
  flex-direction: column;
  position: fixed;
  inset: 0;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}

/* ── HEADER — full bleed, inner content capped ── */
.app-header {
  width: 100%;
  flex-shrink: 0;
  padding: calc(env(safe-area-inset-top) + 14px) 0 14px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--separator);
}
.header-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.sidebar-btn:hover { color: var(--label); }

/* ── SIDEBAR ── */
.sidebar {
  position: fixed;
  top: 0; left: -300px;
  width: 280px;
  height: 100%;
  background: #111;
  border-right: 0.5px solid var(--separator);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: left 0.25s ease;
}
.sidebar.open { left: 0; }
.sidebar-head {
  padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
  border-bottom: 0.5px solid var(--separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.sidebar-head-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sidebar-close {
  background: none;
  border: none;
  color: var(--label-tertiary);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.sidebar-search {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--separator);
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  background: var(--bg-secondary);
  border: none;
  border-radius: 8px;
  color: var(--label);
  font-family: var(--sf);
  font-size: 14px;
  padding: 8px 10px;
  outline: none;
}
.sidebar-search input::placeholder { color: var(--label-tertiary); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-list::-webkit-scrollbar { width: 0; }
.ep-item {
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 8px;
  margin: 2px 8px;
  transition: background 0.1s;
}
.ep-item:hover { background: var(--bg-secondary); }
.ep-item.active { background: rgba(255,69,58,0.15); }
.ep-item-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--red);
  margin-bottom: 2px;
}
.ep-item-title {
  font-size: 12px;
  color: var(--label-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 199;
}
#sidebar-backdrop.visible { display: block; }

/* ── LOCKED EPISODE PILL ── */
.locked-ep-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,69,58,0.15);
  border-radius: 20px;
  padding: 5px 10px 5px 12px;
  font-size: 13px;
  color: var(--red);
  margin-bottom: 8px;
}
.locked-ep-pill button {
  background: none;
  border: none;
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  opacity: 0.7;
}
.locked-ep-pill button:hover { opacity: 1; }
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 1;
  letter-spacing: -0.5px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.app-title:active { opacity: 0.7; }
.app-title span { color: var(--red); }
.ep-badge { font-size: 13px; color: var(--label-secondary); }
.ep-badge strong { color: var(--red); font-weight: 600; }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 0;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  max-width: 720px;
}
.scroll-area::-webkit-scrollbar { width: 0; }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 1px;
  color: var(--label-secondary);
  margin-bottom: 10px;
}
.empty-sub { font-size: 15px; color: var(--label-tertiary); line-height: 1.5; }

/* ── SECTION HEADER ── */
.section-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 4px 0 8px;
}

/* ── AI CARD ── */
.ai-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body h3 {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-quaternary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin: 16px 0 4px;
}
.ai-body ul, .ai-body ol { padding-left: 18px; }
.ai-body li { margin-bottom: 4px; color: var(--label-secondary); }
.ai-body blockquote {
  border-left: 2px solid var(--red);
  padding: 2px 0 2px 12px;
  margin: 6px 0;
  color: var(--label);
  font-style: normal;
}
.ai-body p { margin-bottom: 6px; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body strong { color: var(--label); font-weight: 600; }
.ai-body hr { border: none; border-top: 0.5px solid var(--separator); margin: 12px 0; }

/* ── VIEW TRANSCRIPTS BUTTON ── */
.view-transcripts-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  cursor: pointer;
  margin-top: 4px;
  margin-bottom: 8px;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-transcripts-btn:hover { background: #3a3a3c; }

/* ── TRANSCRIPTS PANEL ── */
.transcripts-panel { display: none; margin-bottom: 12px; }
.transcripts-panel.open { display: block; }

/* ── CHAT ── */
.chat-item {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-top: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-q-label {
  font-size: 15px;
  line-height: 1.65;
  color: var(--red);
  margin-bottom: 10px;
  white-space: pre-wrap;
}
.chat-a-body {
  font-size: 15px;
  line-height: 1.65;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-a-body blockquote { border-left: 3px solid var(--red); padding-left: 12px; margin: 8px 0; font-style: italic; color: var(--label-secondary); }
.chat-a-body p { margin-bottom: 6px; }
.chat-a-body strong { color: var(--label); }
.chat-a-body ul, .chat-a-body ol { padding-left: 20px; }
.chat-a-body li { margin-bottom: 4px; }

/* ── VIEW EPISODE BUTTON ── */
.view-ep-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 13px;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-ep-btn:hover { background: #3a3a3c; }
.ep-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ── RESULT CARDS ── */
.result-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.result-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
  flex-wrap: wrap;
}
.result-ep {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-tertiary);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  min-width: 0;
}
.result-ts { font-family: var(--sf-mono); font-size: 12px; color: var(--red); flex-shrink: 0; }
.result-speaker { font-size: 11px; color: var(--label-quaternary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
.result-text { font-size: 15px; line-height: 1.55; color: var(--label-secondary); word-wrap: break-word; overflow-wrap: break-word; }
.result-text mark { background: transparent; color: var(--orange); font-weight: 500; }

/* ── BOTTOM INPUT AREA ── */
.input-area {
  flex-shrink: 0;
  padding: 12px 20px;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--separator);
  width: 100%;
  max-width: 720px;
}
.input-bar {
  display: flex;
  align-items: flex-end;
  background: var(--bg-secondary);
  border-radius: 22px;
  padding: 6px 6px 6px 16px;
  gap: 8px;
  min-height: 44px;
}
.input-bar textarea {
  flex: 1;
  background: none;
  border: none;
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  outline: none;
  -webkit-appearance: none;
  min-width: 0;
  padding: 5px 0;
  resize: none;
  overflow-y: hidden;
  line-height: 1.4;
  max-height: 160px;
  overflow-y: auto;
}
.input-bar textarea::placeholder { color: var(--label-tertiary); }
.input-submit {
  background: var(--red);
  border: none;
  border-radius: 50%;
  color: #fff;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
  transition: opacity 0.15s;
  -webkit-appearance: none;
}
.input-submit:active { opacity: 0.7; }
.input-submit:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--fill);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-row { display: flex; align-items: center; padding: 14px 0; font-size: 14px; color: var(--label-tertiary); }
.scroll-bottom-pad { height: 20px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span>AF</span>BRAIN</div>
    <input class="login-field" type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Continue</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen">

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">Episodes</span>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="sidebar-search-input" placeholder="Filter episodes..." oninput="filterEpisodes(this.value)">
    </div>
    <div class="sidebar-list" id="episode-list">
      <div style="padding:20px;color:var(--label-tertiary);font-size:13px">Loading...</div>
    </div>
  </div>
  <div id="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <div class="app-header">
    <div class="header-inner">
      <button class="sidebar-btn" onclick="toggleSidebar()">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect width="18" height="2" rx="1" fill="currentColor"/><rect y="6" width="18" height="2" rx="1" fill="currentColor"/><rect y="12" width="18" height="2" rx="1" fill="currentColor"/></svg>
      </button>
      <div class="app-title" style="flex:1" onclick="resetApp()"><span>AF</span>BRAIN</div>
      <div class="ep-badge"><strong id="ep-count">—</strong> episodes</div>
    </div>
  </div>

  <div class="scroll-area" id="scroll-area">
    <div id="results-area">
      <div class="empty-state">
        <div class="empty-title">Search Andy's Mind</div>
        <div class="empty-sub">Ask about episodes, predictions, stories, quotes, or any topic Andy has covered.</div>
      </div>
    </div>
    <div class="scroll-bottom-pad"></div>
  </div>

  <div class="input-area">
    <div id="locked-pill" style="display:none">
      <div class="locked-ep-pill">
        <span id="locked-label"></span>
        <button onclick="clearLockedEpisode()">✕</button>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="search-input" placeholder="Ask anything..." rows="1"></textarea>
      <button class="input-submit" id="main-submit" onclick="handleSubmit()">&#8593;</button>
    </div>
  </div>

</div>

<script>
let currentResults = [];
let chatHistory = [];
let currentQuery = '';
let analyzing = false;
let hasResults = false;
let lockedEpisode = null;   // episode number string when browsing a specific episode
let allEpisodes = [];        // cached episode list for sidebar filtering

document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw}) });
    if (res.ok) {
      const login = document.getElementById('login-screen');
      const main  = document.getElementById('main-screen');
      login.style.opacity = '0';
      setTimeout(() => {
        login.style.display = 'none';
        main.style.display = 'flex';
        requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
      }, 200);
      loadStats();
      document.getElementById('search-input').focus();
    } else {
      err.textContent = 'Incorrect password.';
      document.getElementById('pw-input').value = '';
    }
  } catch(e) { err.textContent = 'Connection error.'; }
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('ep-count').textContent = data.episodes.toLocaleString();
  } catch(e) {}
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  const opening = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('visible');
  if (opening) {
    loadEpisodeList();
    document.getElementById('sidebar-search-input').value = '';
  }
}

async function loadEpisodeList() {
  try {
    const res = await fetch('/api/episodes');
    const data = await res.json();
    allEpisodes = data.episodes || [];
    renderEpisodeList(allEpisodes);
  } catch(e) {
    document.getElementById('episode-list').innerHTML =
      '<div style="padding:20px;color:var(--label-tertiary);font-size:13px">Failed to load.</div>';
  }
}

function formatEpSubtitle(title) {
  // Strip "Ep 1016 - " or "Ep_1016_" or "Ep_01_" prefix and file extension
  let s = title
    .replace(/^Ep[\s_]*\d+[\s_]*[-–]?[\s_]*/i, '')
    .replace(/\.(mp3|mp4|m4a|docx|wav)$/i, '');
  // Parse date: MM.DD.YYYY, MM.DD.YY, or MM_DD_YY, M_D_YY (underscores or dots)
  const dm = s.match(/^(\d{1,2})[._](\d{1,2})[._](\d{2,4})[_\s]?/);
  let dateStr = '';
  if (dm) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const year = dm[3].length === 2 ? '20' + dm[3] : dm[3];
    dateStr = `${months[parseInt(dm[1],10)-1]} ${parseInt(dm[2],10)}, ${year}`;
    s = s.slice(dm[0].length);
  }
  // Identify show type
  let show = /q&af/i.test(s) ? 'Q&AF' : /cti/i.test(s) ? 'CTI' : '';
  return dateStr ? (show ? `${show} · ${dateStr}` : dateStr) : show || title;
}

function renderEpisodeList(episodes) {
  const list = document.getElementById('episode-list');
  if (!episodes.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--label-tertiary);font-size:13px">No episodes.</div>';
    return;
  }
  const sorted = [...episodes].sort((a, b) => {
    const na = parseInt(a.title.match(/(\d+)/)?.[1] || '0', 10);
    const nb = parseInt(b.title.match(/(\d+)/)?.[1] || '0', 10);
    return nb - na;
  });
  list.innerHTML = sorted.map(ep => {
    const num = ep.title.match(/(\d+)/)?.[1] || '';
    const subtitle = formatEpSubtitle(ep.title);
    const clean = ep.title.replace(/\.(mp3|mp4|m4a|docx)$/i, '').replace(/[_-]/g, ' ').trim();
    const isActive = lockedEpisode === num;
    return `<div class="ep-item${isActive ? ' active' : ''}" onclick="loadEpisode('${num}', '${clean.replace(/'/g,"\\'")}')">
      <div class="ep-item-num">Ep ${num}</div>
      <div class="ep-item-title">${subtitle}</div>
    </div>`;
  }).join('');
}

function filterEpisodes(query) {
  const q = query.toLowerCase();
  const filtered = q ? allEpisodes.filter(ep =>
    ep.title.toLowerCase().includes(q)
  ) : allEpisodes;
  renderEpisodeList(filtered);
}

function loadEpisode(epNum, title) {
  toggleSidebar();
  lockedEpisode = epNum;
  document.getElementById('locked-pill').style.display = 'block';
  document.getElementById('locked-label').textContent = `Ep ${epNum}`;
  document.getElementById('search-input').placeholder = `Search in Ep ${epNum}...`;
  resetApp(false, false);
  doSearch(`episode ${epNum}`, epNum);
}

function openEpisode(epNum) {
  lockedEpisode = epNum;
  document.getElementById('locked-pill').style.display = 'block';
  document.getElementById('locked-label').textContent = `Ep ${epNum}`;
  document.getElementById('search-input').placeholder = `Search in Ep ${epNum}...`;
  resetApp(false, false);
  doSearch(`episode ${epNum}`, epNum);
}

function addEpisodeButtons(container, text) {
  const matches = [...text.matchAll(/\bEp\s+(\d{3,4})\b/g)];
  const nums = [...new Set(matches.map(m => m[1]))];
  if (!nums.length) return;
  const row = document.createElement('div');
  row.className = 'ep-btn-row';
  nums.forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'view-ep-btn';
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 4L7.5 6L4.5 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg> View Ep ${num}`;
    btn.onclick = () => openEpisode(num);
    row.appendChild(btn);
  });
  container.appendChild(row);
}

function clearLockedEpisode() {
  lockedEpisode = null;
  document.getElementById('locked-pill').style.display = 'none';
  document.getElementById('search-input').placeholder = 'Ask anything...';
  resetApp(false, false);
}

// ── RESET ─────────────────────────────────────────────────────────────────────

function resetApp(clearLock = true, focusInput = true) {
  currentResults = []; chatHistory = []; currentQuery = ''; analyzing = false; hasResults = false;
  if (clearLock) {
    lockedEpisode = null;
    document.getElementById('locked-pill').style.display = 'none';
    document.getElementById('search-input').placeholder = 'Ask anything...';
  }
  searchInput.value = ''; searchInput.style.height = 'auto';
  document.getElementById('results-area').innerHTML = `
    <div class="empty-state">
      <div class="empty-title">Search Andy's Mind</div>
      <div class="empty-sub">Ask about episodes, predictions, stories, quotes, or any topic Andy has covered.</div>
    </div>`;
  if (focusInput) document.getElementById('search-input').focus();
}

const searchInput = document.getElementById('search-input');
function autoResizeInput() {
  searchInput.style.height = 'auto';
  searchInput.style.height = Math.min(searchInput.scrollHeight, 160) + 'px';
}
searchInput.addEventListener('input', autoResizeInput);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); }
});

function handleSubmit() {
  const val = document.getElementById('search-input').value.trim();
  if (!val) return;
  searchInput.value = ''; searchInput.style.height = 'auto';
  if (hasResults) { doFollowup(val); } else { doSearch(val); }
}

async function doSearch(query, episodeFilter) {
  currentQuery = query; chatHistory = []; hasResults = false;
  const area = document.getElementById('results-area');
  area.innerHTML = '<div class="loading-row"><span class="spinner"></span>Searching...</div>';
  try {
    const body = { query };
    const ep = episodeFilter || lockedEpisode;
    if (ep) body.episode_filter = ep;
    const res = await fetch('/api/search', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) return;
    const data = await res.json();
    currentResults = data.results || [];
    renderResults(query, currentResults, !!ep);
  } catch(e) {
    area.innerHTML = '<div class="loading-row">Search failed. Try again.</div>';
  }
}

function renderResults(query, results, autoExpand = false) {
  const area = document.getElementById('results-area');
  if (!results.length) {
    area.innerHTML = `<div class="empty-state"><div class="empty-title">No Results</div><div class="empty-sub">Nothing found for "${query}".</div></div>`;
    return;
  }
  hasResults = true;

  let transcriptHtml = '';
  results.forEach(r => {
    const epShort = r.episode_title.replace(/\.(mp3|mp4|m4a)$/i, '').substring(0, 60);
    const snippet = highlightText(r.text, query);
    const speaker = r.speaker ? `<div class="result-speaker">${r.speaker}</div>` : '';
    transcriptHtml += `<div class="result-card">
      <div class="result-meta-row">
        <span class="result-ep">${epShort}</span>
        <span class="result-ts">${r.timestamp}</span>
      </div>
      ${speaker}
      <div class="result-text">${snippet}</div>
    </div>`;
  });

  const sectionLabel = autoExpand ? 'AI Summary' : 'AI Analysis';
  const btnLabel = `View Transcripts (${results.length}) &#8964;`;

  let html = `<div class="section-header">${sectionLabel}</div>
  <div id="ai-section">
    <div class="ai-card">
      <div class="chat-q-label">&ldquo;${query.replace(/"/g, '&quot;')}&rdquo;</div>
      <div id="ai-content" class="ai-body"><div class="loading-row"><span class="spinner"></span>Analyzing transcripts...</div></div>
    </div>
    <button class="view-transcripts-btn" id="transcripts-toggle" onclick="toggleTranscripts()">
      ${btnLabel}
    </button>
    <div class="transcripts-panel" id="transcripts-panel">${transcriptHtml}</div>
    <div id="chat-thread"></div>
  </div>`;

  area.innerHTML = html;
  scrollToTop();
  runAnalysis(query, results, autoExpand);
}

function toggleTranscripts() {
  const panel = document.getElementById('transcripts-panel');
  const btn = document.getElementById('transcripts-toggle');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    btn.innerHTML = `Hide Transcripts &#8963;`;
  } else {
    btn.innerHTML = `View Transcripts (${currentResults.length}) &#8964;`;
  }
}

function highlightText(text, query, maxChars=280) {
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 3);
  let bestPos = 0, bestScore = 0;
  const tLower = text.toLowerCase();
  for (let i = 0; i < Math.max(1, text.length - 50); i += 15) {
    const w = tLower.substring(i, i + 200);
    const score = words.filter(w2 => w.includes(w2)).length;
    if (score > bestScore) { bestScore = score; bestPos = i; }
  }
  const start = Math.max(0, bestPos - 30);
  const end = Math.min(text.length, start + maxChars);
  let snippet = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
  snippet = snippet.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  words.forEach(word => {
    const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    snippet = snippet.replace(re, m => `<mark>${m}</mark>`);
  });
  return snippet;
}

async function consumeStream(res, onChunk, onDone, onError) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let sseBuffer = '';
  let fullText = '';
  let displayedLen = 0;
  let streamDone = false;

  const tick = () => {
    if (displayedLen < fullText.length) {
      const behind = fullText.length - displayedLen;
      const speed = behind > 60 ? Math.ceil(behind / 10) : 3;
      displayedLen = Math.min(displayedLen + speed, fullText.length);
      onChunk(fullText.slice(0, displayedLen));
    }
    if (!streamDone || displayedLen < fullText.length) {
      requestAnimationFrame(tick);
    } else {
      onDone(fullText);
    }
  };
  requestAnimationFrame(tick);

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const lines = sseBuffer.split('\n');
      sseBuffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (raw === '[DONE]') { streamDone = true; return; }
        try {
          const parsed = JSON.parse(raw);
          if (parsed.error) { streamDone = true; onError(parsed.error); return; }
          if (parsed.text) fullText += parsed.text;
        } catch {}
      }
    }
    streamDone = true;
  } catch(e) {
    streamDone = true;
    onError(e.message);
  }
}

async function runAnalysis(query, results) {
  if (analyzing) return;
  analyzing = true;
  const el = document.getElementById('ai-content');
  if (!el) { analyzing = false; return; }
  try {
    const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query, results: results.slice(0, 20)}) });
    await consumeStream(res,
      (text) => { el.innerHTML = marked.parse(text); },
      (text) => {
        el.innerHTML = text ? marked.parse(text) : '<span style="color:var(--label-tertiary)">No answer — try rephrasing or adding more context.</span>';
        if (text) { chatHistory.push({q: query, a: text}); addEpisodeButtons(el.parentElement, text); }
      },
      (err) => { el.innerHTML = `<span style="color:var(--label-tertiary)">${err}</span>`; }
    );
  } catch(e) {
    el.innerHTML = '<span style="color:var(--label-tertiary)">Analysis unavailable.</span>';
  }
  analyzing = false;
}

async function doFollowup(question) {
  const thread = document.getElementById('chat-thread');
  if (!thread) return;
  const itemId = `chat-${Date.now()}`;
  thread.innerHTML += `<div class="chat-item" id="${itemId}">
    <div class="chat-q-label">&ldquo;${question.replace(/"/g, '&quot;')}&rdquo;</div>
    <div class="chat-a-body"><div class="loading-row"><span class="spinner"></span>Thinking...</div></div>
  </div>`;
  scrollToBottom();
  try {
    const followupBody = {question, history: chatHistory, original_query: currentQuery};
    if (lockedEpisode) followupBody.episode_filter = lockedEpisode;
    const res = await fetch('/api/followup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(followupBody) });
    const item = document.getElementById(itemId);
    const body = item.querySelector('.chat-a-body');
    body.innerHTML = '';
    await consumeStream(res,
      (text) => { body.innerHTML = marked.parse(text); scrollToBottom(); },
      (text) => {
        body.innerHTML = marked.parse(text || 'No answer — try rephrasing or adding more context.');
        if (text) { chatHistory.push({q: question, a: text}); addEpisodeButtons(item, text); }
        scrollToBottom();
      },
      (err) => { body.textContent = 'Request failed.'; }
    );
  } catch(e) {
    const item = document.getElementById(itemId);
    if (item) item.querySelector('.chat-a-body').textContent = 'Request failed.';
  }
}

function scrollToBottom() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = s.scrollHeight, 50);
}
function scrollToTop() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = 0, 50);
}

// Keep input above iOS keyboard — resize main-screen to match visual viewport
const mainScreen = document.getElementById('main-screen');
if (window.visualViewport) {
  const onViewport = () => {
    const vv = window.visualViewport;
    mainScreen.style.height = vv.height + 'px';
    mainScreen.style.top = vv.offsetTop + 'px';
  };
  window.visualViewport.addEventListener('resize', onViewport);
  window.visualViewport.addEventListener('scroll', onViewport);
}
// Prevent body scroll — only scroll-area/sidebar should scroll
document.body.addEventListener('touchmove', function(e) {
  if (!e.target.closest('.scroll-area, .sidebar-list')) e.preventDefault();
}, { passive: false });

(async function() {
  try {
    const res = await fetch('/api/stats');
    if (res.ok) {
      const data = await res.json();
      const login = document.getElementById('login-screen');
      const main  = document.getElementById('main-screen');
      login.style.display = 'none';
      main.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
      document.getElementById('ep-count').textContent = data.episodes.toLocaleString();
      document.getElementById('search-input').focus();
    } else {
      const login = document.getElementById('login-screen');
      login.style.opacity = '1';
    }
  } catch(e) {
    document.getElementById('login-screen').style.opacity = '1';
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFBrain">
<meta name="google" content="notranslate">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/apple-touch-icon.png">
<title>AFBrain</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

:root {
  --bg-primary: #000000;
  --bg-secondary: #1c1c1e;
  --bg-tertiary: #2c2c2e;
  --separator: rgba(84,84,88,0.65);
  --red: #ff453a;
  --orange: #ff9f0a;
  --label: #ffffff;
  --label-secondary: rgba(235,235,245,0.6);
  --label-tertiary: rgba(235,235,245,0.3);
  --label-quaternary: rgba(235,235,245,0.16);
  --fill: rgba(120,120,128,0.36);
  --radius: 12px;
  --radius-lg: 16px;
  --sf: -apple-system, 'Helvetica Neue', sans-serif;
  --sf-mono: 'SF Mono', 'Menlo', monospace;
}

html {
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg-primary);
  color: var(--label);
  font-family: var(--sf);
  height: 100%;
  overflow: hidden;
  position: fixed;
  width: 100%;
  font-size: 17px;
  line-height: 1.47;
}

/* ── LOGIN ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: 0 24px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 40px;
}
.login-logo span { color: var(--red); }
.login-field {
  background: var(--bg-secondary);
  border: none;
  border-radius: var(--radius);
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  padding: 14px 16px;
  width: 100%;
  outline: none;
  margin-bottom: 12px;
  -webkit-appearance: none;
}
.login-field::placeholder { color: var(--label-tertiary); }
.login-btn {
  width: 100%;
  height: 50px;
  background: var(--red);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: var(--sf);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
  transition: opacity 0.15s;
}
.login-btn:active { opacity: 0.8; }
.login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ── MAIN LAYOUT ── */
#main-screen {
  display: none;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 100vh;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}

/* ── HEADER — full bleed, inner content capped ── */
.app-header {
  width: 100%;
  flex-shrink: 0;
  padding: calc(env(safe-area-inset-top) + 14px) 0 14px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--separator);
}
.header-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.sidebar-btn:hover { color: var(--label); }

/* ── SIDEBAR ── */
.sidebar {
  position: fixed;
  top: 0; left: -300px;
  width: 280px;
  height: 100%;
  background: #111;
  border-right: 0.5px solid var(--separator);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: left 0.25s ease;
}
.sidebar.open { left: 0; }
.sidebar-head {
  padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
  border-bottom: 0.5px solid var(--separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.sidebar-head-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sidebar-close {
  background: none;
  border: none;
  color: var(--label-tertiary);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.sidebar-search {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--separator);
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  background: var(--bg-secondary);
  border: none;
  border-radius: 8px;
  color: var(--label);
  font-family: var(--sf);
  font-size: 14px;
  padding: 8px 10px;
  outline: none;
}
.sidebar-search input::placeholder { color: var(--label-tertiary); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-list::-webkit-scrollbar { width: 0; }
.ep-item {
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 8px;
  margin: 2px 8px;
  transition: background 0.1s;
}
.ep-item:hover { background: var(--bg-secondary); }
.ep-item.active { background: rgba(255,69,58,0.15); }
.ep-item-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--red);
  margin-bottom: 2px;
}
.ep-item-title {
  font-size: 12px;
  color: var(--label-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 199;
}
#sidebar-backdrop.visible { display: block; }

/* ── LOCKED EPISODE PILL ── */
.locked-ep-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,69,58,0.15);
  border-radius: 20px;
  padding: 5px 10px 5px 12px;
  font-size: 13px;
  color: var(--red);
  margin-bottom: 8px;
}
.locked-ep-pill button {
  background: none;
  border: none;
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  opacity: 0.7;
}
.locked-ep-pill button:hover { opacity: 1; }
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 1;
  letter-spacing: -0.5px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.app-title:active { opacity: 0.7; }
.app-title span { color: var(--red); }
.new-chat-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  border-radius: 8px;
  transition: color 0.15s, background 0.15s;
}
.new-chat-btn:hover { color: var(--label); background: var(--bg-secondary); }
.new-chat-btn:active { opacity: 0.6; }

/* ── DESKTOP SIDEBAR ALWAYS OPEN ── */
@media (min-width: 768px) {
  .sidebar { left: 0 !important; box-shadow: none; }
  .sidebar-close { display: none; }
  #sidebar-backdrop { display: none !important; }
  #main-screen { padding-left: 280px; }
  .sidebar-btn { display: none; }
}

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 0;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  max-width: 720px;
}
.scroll-area::-webkit-scrollbar { width: 0; }

/* ── EMPTY / QUOTE ── */
.empty-state { text-align: center; padding: 60px 20px 20px; }
.quote-block {
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
}
.quote-text {
  font-size: 18px;
  font-style: italic;
  color: var(--label-secondary);
  line-height: 1.55;
  max-width: 520px;
  transition: opacity 0.6s ease;
}
.quote-ep {
  margin-top: 10px;
  font-size: 12px;
  color: var(--label-tertiary);
  font-style: normal;
  transition: opacity 0.6s ease;
}
/* ── SUGGESTION CHIPS ── */
.suggestion-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 20px 0 8px;
}
.suggestion-chip {
  background: var(--bg-secondary);
  border: 0.5px solid var(--separator);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--label-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  -webkit-user-select: none;
  user-select: none;
  line-height: 1.3;
  text-align: left;
}
.suggestion-chip:hover { background: var(--fill); color: var(--label); }
.suggestion-chip:active { opacity: 0.7; }
/* ── BRAIN LOADER ── */
@keyframes brain-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
.brain-loader {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-right: 10px;
}
.brain-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  animation: brain-pulse 1.2s ease-in-out infinite;
}
.brain-dot:nth-child(2) { animation-delay: 0.2s; }
.brain-dot:nth-child(3) { animation-delay: 0.4s; }
.loading-row { display: flex; align-items: center; padding: 14px 0; font-size: 14px; color: var(--label-tertiary); }

/* ── SECTION HEADER ── */
.section-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 4px 0 8px;
}

/* ── AI CARD ── */
.ai-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body h3 {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-quaternary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin: 16px 0 4px;
}
.ai-body ul, .ai-body ol { padding-left: 18px; }
.ai-body li { margin-bottom: 4px; color: var(--label-secondary); }
.ai-body blockquote {
  border-left: 2px solid var(--red);
  padding: 2px 0 2px 12px;
  margin: 6px 0;
  color: var(--label);
  font-style: normal;
}
.ai-body p { margin-bottom: 6px; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body strong { color: var(--label); font-weight: 600; }
.ai-body hr { border: none; border-top: 0.5px solid var(--separator); margin: 12px 0; }

/* ── VIEW TRANSCRIPTS BUTTON ── */
.view-transcripts-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  cursor: pointer;
  margin-top: 4px;
  margin-bottom: 8px;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-transcripts-btn:hover { background: #3a3a3c; }

/* ── TRANSCRIPTS PANEL ── */
.transcripts-panel { display: none; margin-bottom: 12px; }
.transcripts-panel.open { display: block; }

/* ── CHAT ── */
.chat-item {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-top: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-q-label {
  font-size: 15px;
  line-height: 1.65;
  color: var(--red);
  margin-bottom: 10px;
  white-space: pre-wrap;
}
.chat-a-body {
  font-size: 15px;
  line-height: 1.65;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-a-body blockquote { border-left: 3px solid var(--red); padding-left: 12px; margin: 8px 0; font-style: italic; color: var(--label-secondary); }
.chat-a-body p { margin-bottom: 6px; }
.chat-a-body strong { color: var(--label); }
.chat-a-body ul, .chat-a-body ol { padding-left: 20px; }
.chat-a-body li { margin-bottom: 4px; }

/* ── VIEW EPISODE BUTTON ── */
.view-ep-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 13px;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-ep-btn:hover { background: #3a3a3c; }
.ep-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ── RESULT CARDS ── */
.result-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.result-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
  flex-wrap: wrap;
}
.result-ep {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-tertiary);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  min-width: 0;
}
.result-ts { font-family: var(--sf-mono); font-size: 12px; color: var(--red); flex-shrink: 0; }
.result-speaker { font-size: 11px; color: var(--label-quaternary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
.result-text { font-size: 15px; line-height: 1.55; color: var(--label-secondary); word-wrap: break-word; overflow-wrap: break-word; }
.result-text mark { background: transparent; color: var(--orange); font-weight: 500; }

/* ── BOTTOM INPUT AREA ── */
/* In-flow at bottom of #main-screen flex column.
   When keyboard opens, _pinHeight sets #main-screen height to
   visualViewport.height so this element naturally rides above the keyboard. */
.input-area {
  width: 100%;
  flex-shrink: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--separator);
}
.input-area-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 12px);
}
.input-bar {
  display: flex;
  align-items: flex-end;
  background: var(--bg-secondary);
  border-radius: 22px;
  padding: 6px 6px 6px 16px;
  gap: 8px;
  min-height: 44px;
}
.input-bar textarea {
  flex: 1;
  background: none;
  border: none;
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  outline: none;
  -webkit-appearance: none;
  min-width: 0;
  padding: 5px 0;
  resize: none;
  overflow-y: hidden;
  line-height: 1.4;
  max-height: 160px;
  overflow-y: auto;
}
.input-bar textarea::placeholder { color: var(--label-tertiary); }
.input-submit {
  background: var(--red);
  border: none;
  border-radius: 50%;
  color: #fff;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
  transition: opacity 0.15s;
  -webkit-appearance: none;
}
.input-submit:active { opacity: 0.7; }
.input-submit:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── SPINNER ── */
.scroll-bottom-pad { height: 12px; }

/* ── UPLOAD MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 400;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 100%;
  max-width: 400px;
}
.modal-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 16px;
}
.modal-field {
  width: 100%;
  background: var(--bg-tertiary);
  border: none;
  border-radius: var(--radius);
  color: var(--label);
  font-family: var(--sf);
  font-size: 15px;
  padding: 12px 14px;
  outline: none;
  margin-bottom: 10px;
  -webkit-appearance: none;
}
.modal-field::placeholder { color: var(--label-tertiary); }
.file-drop {
  border: 1.5px dashed var(--separator);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 14px;
  transition: border-color 0.15s;
}
.file-drop:hover { border-color: var(--red); }
.file-drop.has-file { border-color: var(--red); background: rgba(255,69,58,0.06); }
.file-drop-label { font-size: 14px; color: var(--label-tertiary); }
.file-drop-label strong { color: var(--label-secondary); }
.modal-row { display: flex; gap: 10px; }
.modal-btn {
  flex: 1;
  height: 44px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--sf);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
}
.modal-btn-primary { background: var(--red); color: #fff; }
.modal-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-btn-cancel { background: var(--bg-tertiary); color: var(--label-secondary); }
.modal-status { font-size: 13px; color: var(--label-secondary); margin-top: 10px; min-height: 18px; text-align: center; }
.upload-tabs { display: flex; gap: 0; margin-bottom: 18px; border-radius: var(--radius); overflow: hidden; background: var(--bg-tertiary); padding: 3px; }
.upload-tab {
  flex: 1; height: 34px; border: none; background: transparent; color: var(--label-secondary);
  font-family: var(--sf); font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px;
  transition: background 0.15s, color 0.15s; -webkit-appearance: none;
}
.upload-tab.active { background: var(--bg-secondary); color: var(--label-primary); font-weight: 600; }
#drive-urls-input::placeholder { color: var(--label-tertiary); }
.drive-source-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-tertiary); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
}
.drive-source-url {
  flex: 1; color: var(--label-secondary); font-family: var(--sf-mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.drive-source-del {
  background: none; border: none; color: var(--label-tertiary);
  font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1;
  flex-shrink: 0; -webkit-appearance: none;
}
#drive-log .log-line-done { color: #30d158; }
#drive-log .log-line-error { color: #ff453a; }
#drive-log .log-line-info { color: var(--label-secondary); }
#drive-log .log-line-skipped { color: var(--label-tertiary); }

/* ── VIDEO PLAYER PANEL ── */
.video-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #000;
  z-index: 350;
  transform: translateY(100%);
  transition: transform 0.25s ease;
  max-height: 60vh;
  display: flex;
  flex-direction: column;
}
.video-panel.open { transform: translateY(0); }
.video-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border-top: 0.5px solid var(--separator);
  flex-shrink: 0;
}
.video-panel-title { font-size: 13px; font-weight: 600; color: var(--label); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-panel-ts { font-family: var(--sf-mono); font-size: 12px; color: var(--red); margin: 0 12px; flex-shrink: 0; }
.video-panel-close { background: none; border: none; color: var(--label-tertiary); font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0; }
.video-panel video { width: 100%; flex: 1; min-height: 0; display: block; background: #000; }
.play-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,69,58,0.12);
  border: none;
  border-radius: 6px;

  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  cursor: pointer;
  margin-left: 8px;
  flex-shrink: 0;
  -webkit-appearance: none;
}
.play-btn:hover { background: rgba(255,69,58,0.22); }
.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(120,120,128,0.18);
  border: none;
  border-radius: 6px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  cursor: pointer;
  margin-left: 4px;
  flex-shrink: 0;
  -webkit-appearance: none;
  text-decoration: none;
}
.download-btn:hover { background: rgba(120,120,128,0.3); }
.upload-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  font-size: 18px;
  cursor: pointer;

  line-height: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.upload-btn:hover { color: var(--label); }
.delete-ep-btn-unused {
  background: none;
  border: none;
  color: var(--label-quaternary);

  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
  flex-shrink: 0;
}
.delete-ep-btn:hover { color: var(--red); }

/* ── UPLOAD PROGRESS ── */
.upload-progress {
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 14px;
  display: none;
}
.upload-progress.visible { display: block; }
.upload-progress-fill {
  height: 100%;

  width: 0%;

  border-radius: 2px;
}
.upload-success-view { text-align: center; padding: 10px 0 4px; }
.upload-success-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; color: var(--label); }

/* ── GET AI SUMMARY BUTTON ── */
.get-summary-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-secondary);
  border: 0.5px solid var(--separator);
  border-radius: var(--radius-lg);
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 15px;
  font-weight: 500;
  padding: 14px 18px;
  cursor: pointer;
  width: 100%;
  margin-bottom: 8px;
  -webkit-appearance: none;
  transition: background 0.15s;
  justify-content: center;
}
.get-summary-btn:hover { background: var(--bg-tertiary); }
.get-summary-btn:active { opacity: 0.75; }

/* ── VIEW CLIP BUTTON ── */
.view-clip-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--red);
  border: none;
  border-radius: 20px;
  color: #fff;
  font-family: var(--sf);
  font-size: 14px;
  font-weight: 600;
  padding: 9px 18px;
  cursor: pointer;
  margin-top: 14px;
  -webkit-appearance: none;
  transition: opacity 0.15s;
}
.view-clip-btn:active { opacity: 0.75; }
.clip-chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.clip-chip-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--red);
  border: none;
  border-radius: 20px;
  color: #fff;
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 600;
  padding: 0 14px;
  height: 34px;
  cursor: pointer;
  -webkit-appearance: none;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.clip-chip-btn:active { opacity: 0.75; }

/* ── CLIP VIEWER OVERLAY ── */
#clip-viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 600;
  overflow: hidden;
  flex-direction: column;
}
#clip-viewer.open {
  display: flex;
  opacity: 1;
  transition: opacity 0.28s ease;
}
#clip-viewer.open.closing {
  opacity: 0;
  pointer-events: none;
}
.clip-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
  flex-shrink: 0;
  background: #111;
  border-bottom: 0.5px solid var(--separator);
}
.clip-header-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 16px;
  cursor: pointer;
  padding: 4px 0;
  min-width: 64px;
  -webkit-appearance: none;
}
.clip-header-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--label);
}
.clip-video-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  position: relative;
}
#clip-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  background: #000;

}
#clip-loading .clip-loading-label {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
}
.clip-progress-track {
  width: 220px;
  height: 3px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.clip-progress-bar {
  position: absolute;
  top: 0; height: 100%; width: 38%;
  background: rgba(255,255,255,0.85);
  border-radius: 2px;
  animation: clip-shimmer 1.4s ease-in-out infinite;
}
@keyframes clip-shimmer {
  0%   { left: -38%; }
  100% { left: 100%; }
}
.clip-video-wrap video { max-width: 100%; max-height: 100%; display: block; }
.clip-trim-area {
  flex-shrink: 0;
  padding: 18px 16px 10px;
  background: #111;
}
.clip-filmstrip-wrap {
  position: relative;
  height: 60px;
  border-radius: 8px;
  overflow: hidden;
  background: #2c2c2e;
  touch-action: none;
}
#clip-filmstrip-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.clip-dim {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(0,0,0,0.55);
  pointer-events: none;
  z-index: 1;
}
#clip-dim-left { left: 0; }
#clip-dim-right { right: 0; }
.clip-sel-bar {
  position: absolute;
  height: 3px;
  background: #ffd60a;
  pointer-events: none;
  z-index: 2;
}
#clip-sel-top { top: 0; }
#clip-sel-bottom { bottom: 0; }
.clip-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 18px;
  background: #ffd60a;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  cursor: ew-resize;
  touch-action: none;
  border-radius: 5px 0 0 5px;
}
#clip-handle-right { border-radius: 0 5px 5px 0; }
.clip-handle-bar {
  width: 2px;
  height: 22px;
  background: rgba(0,0,0,0.45);
  border-radius: 1px;
}
.clip-playhead {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 3px;
  background: #fff;
  border-radius: 2px;
  pointer-events: none;
  z-index: 4;
  box-shadow: 0 0 4px rgba(0,0,0,0.6);
}
.clip-filmstrip-wrap { cursor: crosshair; }
.clip-handle { cursor: ew-resize; }
.clip-speed-badge {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);

  color: #fff;

  font-weight: 700;
  font-family: var(--sf);

.clip-time-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  font-family: var(--sf-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.35);
}
.clip-dur-label {
  font-size: 17px;
  font-weight: 700;
  color: #ffd60a;
  letter-spacing: -0.5px;
  font-family: var(--sf-mono);
  line-height: 1;
}
.clip-actions {
  display: flex;
  gap: 10px;
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 18px);
  background: #111;
  flex-shrink: 0;
}
.clip-action-btn {
  flex: 1;
  height: 50px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--sf);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
  transition: opacity 0.15s;
}
.clip-action-btn:active { opacity: 0.75; }
.clip-play-btn { background: var(--bg-tertiary); color: var(--label); }
.clip-dl-btn { background: var(--red); color: #fff; }

/* ── VIDEO SIDEBAR ITEM ── */
.ep-item-video-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--red);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" translate="no"><span>AF</span>BRAIN</div>
    <input class="login-field" type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Continue</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal-box">
    <!-- Tab switcher -->
    <div class="upload-tabs" id="upload-tabs">
      <button class="upload-tab active" id="tab-upload" onclick="switchUploadTab('upload')">Upload File</button>
      <button class="upload-tab" id="tab-drive" onclick="switchUploadTab('drive')">Drive Import</button>
    </div>

    <!-- Form view -->
    <div id="upload-form-view">
      <input class="modal-field" type="text" id="upload-title" placeholder="Title (auto-detected from filename)">
      <div class="file-drop" id="file-drop" onclick="document.getElementById('video-file-input').click()">
        <div class="file-drop-label" id="file-drop-label"><strong>Choose MP4(s)</strong> or drag and drop</div>
        <input type="file" id="video-file-input" accept=".mp4" multiple style="display:none" onchange="onFileSelected(this)">
      </div>
      <div id="upload-queue-list" style="display:none;margin-bottom:10px;max-height:110px;overflow-y:auto"></div>
      <div class="upload-progress" id="upload-progress">
        <div class="upload-progress-fill" id="upload-progress-fill"></div>
      </div>
      <div class="modal-row">
        <button class="modal-btn modal-btn-cancel" id="upload-cancel-btn" onclick="closeUploadModal()">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="upload-submit-btn" onclick="submitUpload()" disabled>Upload</button>
      </div>
      <div class="modal-status" id="upload-status"></div>
    </div>

    <!-- Drive import view -->
    <div id="drive-form-view" style="display:none">

      <!-- Saved sources section (hidden until sources exist) -->
      <div id="drive-saved-section" style="display:none;margin-bottom:14px">
        <div style="font-size:12px;font-weight:600;color:var(--label-tertiary);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px">Saved Sources</div>
        <div id="drive-saved-list"></div>
        <button class="modal-btn modal-btn-primary" id="drive-scan-btn" onclick="scanSavedSources()" style="width:100%;margin-top:8px">Scan for New Episodes</button>
        <div style="height:1px;background:var(--separator);margin:14px 0"></div>
      </div>

      <!-- Add new source -->
      <div style="font-size:13px;color:var(--label-secondary);margin-bottom:10px;line-height:1.5">
        Paste a Google Drive folder or file link. Must be shared as <strong style="color:var(--label-primary)">"Anyone with the link"</strong>.
      </div>
      <textarea id="drive-urls-input" placeholder="https://drive.google.com/drive/folders/…" style="width:100%;box-sizing:border-box;height:80px;background:var(--bg-tertiary);border:1.5px solid var(--separator);border-radius:10px;color:var(--label-primary);font-family:var(--sf-mono);font-size:13px;padding:10px 12px;resize:none;outline:none;-webkit-appearance:none"></textarea>
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--label-secondary);cursor:pointer">
        <input type="checkbox" id="drive-save-checkbox" style="width:16px;height:16px;accent-color:var(--red);cursor:pointer">
        Save this link for future scans
      </label>
      <div id="drive-log" style="display:none;margin-top:10px;background:var(--bg-tertiary);border-radius:10px;padding:10px 12px;max-height:150px;overflow-y:auto;font-family:var(--sf-mono);font-size:12px;line-height:1.6;color:var(--label-secondary)"></div>
      <div class="modal-row" style="margin-top:12px">
        <button class="modal-btn modal-btn-cancel" id="drive-cancel-btn" onclick="closeUploadModal()">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="drive-submit-btn" onclick="startDriveImport()">Import</button>
      </div>
    </div>

    <!-- Success view -->
    <div id="upload-success-view" style="display:none">
      <div class="upload-success-view">
        <div class="upload-success-title">Upload complete</div>
        <div style="display:flex;justify-content:center">
          <button onclick="closeUploadModal()" style="background:var(--red);color:#fff;border:none;border-radius:var(--radius);font-family:var(--sf);font-size:15px;font-weight:600;cursor:pointer;padding:0 40px;height:44px;-webkit-appearance:none">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CLIP VIEWER / TRIMMER -->
<div id="clip-viewer">
  <!-- Clip saved confirmation overlay -->
  <div id="clip-saved-overlay" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.82);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px">
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg width="26" height="20" viewBox="0 0 26 20" fill="none"><path d="M2 10L10 18L24 2" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px">Clip Saved</div>
    </div>
    <button onclick="closeClipViewer()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-family:var(--sf);font-size:16px;font-weight:600;cursor:pointer;padding:0 36px;height:50px;border-radius:var(--radius);-webkit-appearance:none;letter-spacing:-0.1px">Return To Chat</button>
  </div>

  <div class="clip-header">
    <button class="clip-header-btn" onclick="closeClipViewer()">Cancel</button>
    <span class="clip-header-title">Trim Clip</span>
    <button class="clip-header-btn" id="clip-save-btn" style="color:var(--red);font-weight:600;text-align:right" onclick="downloadTrimmedClip()">Save</button>
  </div>
  <div class="clip-video-wrap">
    <div id="clip-loading" style="display:none">
      <div class="clip-loading-label" id="clip-loading-label">Preparing clip…</div>
      <div class="clip-progress-track">
        <div class="clip-progress-bar" id="clip-progress-bar"></div>
      </div>
    </div>
    <video id="clip-video" playsinline webkit-playsinline></video>
    <div id="clip-speed-badge" class="clip-speed-badge"></div>
  </div>
  <div class="clip-trim-area">
    <div class="clip-filmstrip-wrap" id="clip-filmstrip-wrap">
      <canvas id="clip-filmstrip-canvas"></canvas>
      <div class="clip-dim" id="clip-dim-left"></div>
      <div class="clip-dim" id="clip-dim-right"></div>
      <div class="clip-sel-bar" id="clip-sel-top"></div>
      <div class="clip-sel-bar" id="clip-sel-bottom"></div>
      <div class="clip-handle" id="clip-handle-left"><div class="clip-handle-bar"></div></div>
      <div class="clip-handle" id="clip-handle-right"><div class="clip-handle-bar"></div></div>
      <div class="clip-playhead" id="clip-playhead"></div>
    </div>
    <div class="clip-time-row">
      <span id="clip-start-label">0:00</span>
      <span class="clip-dur-label" id="clip-dur-label">0:00</span>
      <span id="clip-end-label">0:00</span>
    </div>
  </div>
  <div class="clip-actions">
    <button class="clip-action-btn clip-play-btn" id="clip-play-btn" onclick="toggleClipPlay()">Play</button>
    <button class="clip-action-btn clip-dl-btn" onclick="downloadTrimmedClip()">Download</button>
  </div>
</div>

<!-- VIDEO PLAYER PANEL -->
<div class="video-panel" id="video-panel">
  <div class="video-panel-header">
    <span class="video-panel-title" id="video-panel-title"></span>
    <span class="video-panel-ts" id="video-panel-ts"></span>
    <button class="video-panel-close" onclick="closeVideoPanel()">✕</button>
  </div>
  <video id="video-player" controls playsinline></video>
</div>

<!-- MAIN -->
<div id="main-screen">

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">Episodes</span>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="sidebar-search-input" placeholder="Filter episodes..." oninput="filterEpisodes(this.value)">
    </div>
    <div class="sidebar-list" id="episode-list">
      <div style="padding:20px;color:var(--label-tertiary);font-size:13px">Loading...</div>
    </div>
  </div>
  <div id="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <div class="app-header">
    <div class="header-inner">
      <button class="sidebar-btn" onclick="toggleSidebar()">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect width="18" height="2" rx="1" fill="currentColor"/><rect y="6" width="18" height="2" rx="1" fill="currentColor"/><rect y="12" width="18" height="2" rx="1" fill="currentColor"/></svg>
      </button>
      <div class="app-title" style="flex:1" translate="no"><span>AF</span>BRAIN</div>
      <button class="new-chat-btn" onclick="resetApp()" title="New chat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 10C3 6.134 6.134 3 10 3s7 3.134 7 7-3.134 7-7 7H3.5L3 17v-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M10 7v6M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="scroll-area" id="scroll-area">
    <div id="results-area">
      <div class="empty-state" id="empty-state">
        <div class="quote-block" id="quote-block">
          <div class="quote-text" id="quote-text">&#8220;&#8221;</div>
          <div class="quote-ep" id="quote-ep"></div>
        </div>
        <div class="suggestion-chips" id="suggestion-chips"></div>
      </div>
    </div>
    <div class="scroll-bottom-pad"></div>
  </div>

  <!-- Input bar is in-flow inside #main-screen flex column.
       It naturally sits above the keyboard because _pinHeight shrinks
       #main-screen to visualViewport.height when the keyboard opens. -->
  <div class="input-area" id="input-area">
    <div class="input-area-inner">
      <div id="locked-pill" style="display:none">
        <div class="locked-ep-pill">
          <span id="locked-label"></span>
          <button onclick="clearLockedEpisode()">✕</button>
        </div>
      </div>
      <div class="input-bar">
        <textarea id="search-input" placeholder="Ask anything..." rows="1"></textarea>
        <button class="input-submit" id="main-submit" onclick="handleSubmit()">&#8593;</button>
      </div>
    </div>
  </div>

</div>

<script>
let currentResults = [];
let chatHistory = [];
let currentQuery = '';
let analyzing = false;
let hasResults = false;
let lockedEpisode = null;
let allEpisodes = [];
let currentVideoContext = null; // {filename} set when AI response can reference a known video

document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw}) });
    if (res.ok) {
      const login = document.getElementById('login-screen');
      const main  = document.getElementById('main-screen');
      login.style.opacity = '0';
      setTimeout(() => {
        login.style.display = 'none';
        main.style.display = 'flex';
        requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
      }, 200);
      loadStats();
      document.getElementById('search-input').focus();
    } else {
      err.textContent = 'Incorrect password.';
      document.getElementById('pw-input').value = '';
    }
  } catch(e) { err.textContent = 'Connection error.'; }
}

async function loadStats() {
  // ep-count element removed; stats now loaded via initEmptyState / sidebar
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  const opening = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('visible');
  if (opening) {
    loadEpisodeList();
    document.getElementById('sidebar-search-input').value = '';
  }
}

async function loadEpisodeList() {
  try {
    const res = await fetch('/api/episodes');
    const data = await res.json();
    allEpisodes = data.episodes || [];
    renderEpisodeList(allEpisodes);
  } catch(e) {
    document.getElementById('episode-list').innerHTML =
      '<div style="padding:20px;color:var(--label-tertiary);font-size:13px">Failed to load.</div>';
  }
}

function formatEpSubtitle(title) {
  // Strip "Ep 1016 - " or "Ep_1016_" or "Ep_01_" prefix and file extension
  let s = title
    .replace(/^Ep[\s_]*\d+[\s_]*[-–]?[\s_]*/i, '')
    .replace(/\.(mp3|mp4|m4a|docx|wav)$/i, '');
  // Parse date: MM.DD.YYYY, MM.DD.YY, or MM_DD_YY, M_D_YY (underscores or dots)
  const dm = s.match(/^(\d{1,2})[._](\d{1,2})[._](\d{2,4})[_\s]?/);
  let dateStr = '';
  if (dm) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const year = dm[3].length === 2 ? '20' + dm[3] : dm[3];
    dateStr = `${months[parseInt(dm[1],10)-1]} ${parseInt(dm[2],10)}, ${year}`;
    s = s.slice(dm[0].length);
  }
  // Identify show type
  let show = /q&af/i.test(s) ? 'Q&AF' : /cti/i.test(s) ? 'CTI' : '';
  return dateStr ? (show ? `${show} · ${dateStr}` : dateStr) : show || title;
}

function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function renderEpisodeList(episodes) {
  const list = document.getElementById('episode-list');
  if (!episodes.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--label-tertiary);font-size:13px">No episodes.</div>';
    return;
  }
  // Split into video (Drive imports) and regular (numbered) episodes
  const videoEps   = episodes.filter(ep => ep.has_video)
    .sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));
  const regularEps = episodes.filter(ep => !ep.has_video)
    .sort((a, b) => {
      const na = parseInt(a.title.match(/(\d+)/)?.[1] || '0', 10);
      const nb = parseInt(b.title.match(/(\d+)/)?.[1] || '0', 10);
      return nb - na;
    });

  const renderVideo = ep => {
    const epId = ep.video_filename ? ep.video_filename.replace(/\.[^.]+$/, '') : ep.id;
    const dateLabel = ep.uploaded_at ? formatDateDisplay(ep.uploaded_at) : 'Video';
    const safeTitle = ep.title.replace(/'/g, "\\'").replace(/</g, '&lt;');
    const safeFilename = (ep.video_filename || '').replace(/'/g, "\\'");
    const isActive = lockedEpisode === epId;
    return `<div class="ep-item${isActive ? ' active' : ''}" onclick="openVideoEpisode('${safeFilename}','${safeTitle}','${epId}')">
      <div style="flex:1;min-width:0">
        <div class="ep-item-video-title">▶ ${ep.title.replace(/</g,'&lt;')}</div>
        <div class="ep-item-title">${dateLabel}</div>
      </div>
    </div>`;
  };

  const renderRegular = ep => {
    const num = ep.title.match(/(\d+)/)?.[1] || '';
    const subtitle = formatEpSubtitle(ep.title);
    const clean = ep.title.replace(/\.(mp3|mp4|m4a|docx)$/i, '').replace(/[_-]/g, ' ').trim();
    const isActive = lockedEpisode === num;
    return `<div class="ep-item${isActive ? ' active' : ''}" onclick="loadEpisode('${num}', '${clean.replace(/'/g,"\\'")}')">
      <div style="flex:1;min-width:0">
        <div class="ep-item-num">Ep ${num}</div>
        <div class="ep-item-title">${subtitle}</div>
      </div>
    </div>`;
  };

  const sectionLabel = (text) =>
    `<div style="padding:10px 16px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--label-tertiary);text-transform:uppercase">${text}</div>`;

  list.innerHTML =
    (videoEps.length   ? sectionLabel('Video / Audio') + videoEps.map(renderVideo).join('')     : '') +
    (regularEps.length ? sectionLabel('Episodes')      + regularEps.map(renderRegular).join('') : '');
}

function filterEpisodes(query) {
  const q = query.toLowerCase();
  const filtered = q ? allEpisodes.filter(ep =>
    ep.title.toLowerCase().includes(q)
  ) : allEpisodes;
  renderEpisodeList(filtered);
}

function highlightText(text, query, maxChars=280) {
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 3);
  let bestPos = 0, bestScore = 0;
  const tLower = text.toLowerCase();
  for (let i = 0; i < Math.max(1, text.length - 50); i += 15) {
    const w = tLower.substring(i, i + 200);
    const score = words.filter(w2 => w.includes(w2)).length;
    if (score > bestScore) { bestScore = score; bestPos = i; }
  }
  const start = Math.max(0, bestPos - 30);
  const end = Math.min(text.length, start + maxChars);
  let snippet = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
  snippet = snippet.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  words.forEach(word => {
    const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    snippet = snippet.replace(re, m => `<mark>${m}</mark>`);
  });
  return snippet;
}

async function consumeStream(res, onChunk, onDone, onError) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let sseBuffer = '';
  let fullText = '';
  let displayedLen = 0;
  let streamDone = false;

  const tick = () => {
    if (displayedLen < fullText.length) {
      const behind = fullText.length - displayedLen;
      const speed = behind > 60 ? Math.ceil(behind / 10) : 3;
      displayedLen = Math.min(displayedLen + speed, fullText.length);
      onChunk(fullText.slice(0, displayedLen));
    }
    if (!streamDone || displayedLen < fullText.length) {
      requestAnimationFrame(tick);
    } else {
      onDone(fullText);
    }
  };
  requestAnimationFrame(tick);

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const lines = sseBuffer.split('\n');
      sseBuffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (raw === '[DONE]') { streamDone = true; return; }
        try {
          const parsed = JSON.parse(raw);
          if (parsed.error) { streamDone = true; onError(parsed.error); return; }
          if (parsed.text) fullText += parsed.text;
        } catch {}
      }
    }
    streamDone = true;
  } catch(e) {
    streamDone = true;
    onError(e.message);
  }
}

async function runAnalysis(query, results) {
  if (analyzing) return;
  analyzing = true;
  const el = document.getElementById('ai-content');
  if (!el) { analyzing = false; return; }
  try {
    const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query, results: results.slice(0, 20)}) });
    await consumeStream(res,
      (text) => { el.innerHTML = marked.parse(text); },
      (text) => {
        el.innerHTML = text ? marked.parse(text) : '<span style="color:var(--label-tertiary)">No answer — try rephrasing or adding more context.</span>';
        if (text) { chatHistory.push({q: query, a: text}); addEpisodeButtons(el.parentElement, text); addAllClipButtons(el.parentElement, text); }
      },
      (err) => { el.innerHTML = `<span style="color:var(--label-tertiary)">${err}</span>`; }
    );
  } catch(e) {
    el.innerHTML = '<span style="color:var(--label-tertiary)">Analysis unavailable.</span>';
  }
  analyzing = false;
}

async function doFollowup(question) {
  const thread = document.getElementById('chat-thread');
  if (!thread) return;
  const itemId = `chat-${Date.now()}`;
  thread.innerHTML += `<div class="chat-item" id="${itemId}">
    <div class="chat-q-label">&ldquo;${question.replace(/"/g, '&quot;')}&rdquo;</div>
    <div class="chat-a-body"><div class="loading-row"><span class="brain-loader"><span class="brain-dot"></span><span class="brain-dot"></span><span class="brain-dot"></span></span>Thinking...</div></div>
  </div>`;
  scrollToBottom();
  try {
    const followupBody = {question, history: chatHistory, original_query: currentQuery};
    if (lockedEpisode) followupBody.episode_filter = lockedEpisode;
    const res = await fetch('/api/followup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(followupBody) });
    const item = document.getElementById(itemId);
    const body = item.querySelector('.chat-a-body');
    body.innerHTML = '';
    await consumeStream(res,
      (text) => { body.innerHTML = marked.parse(text); scrollToBottom(); },
      (text) => {
        body.innerHTML = marked.parse(text || 'No answer — try rephrasing or adding more context.');
        if (text) { chatHistory.push({q: question, a: text}); addEpisodeButtons(item, text); addAllClipButtons(item, text); }
        scrollToBottom();
      },
      (err) => { body.textContent = 'Request failed.'; }
    );
  } catch(e) {
    const item = document.getElementById(itemId);
    if (item) item.querySelector('.chat-a-body').textContent = 'Request failed.';
  }
}

function _runDriveImport(urls, canReset) {
  const log = document.getElementById('drive-log');
  log.innerHTML = '';
  log.style.display = 'none';
  const btn      = document.getElementById('drive-submit-btn');
  const cancelBtn = document.getElementById('drive-cancel-btn');
  const scanBtn  = document.getElementById('drive-scan-btn');
  btn.disabled = true;
  btn.textContent = 'Importing…';
  cancelBtn.disabled = true;
  if (scanBtn) scanBtn.disabled = true;

  const params = new URLSearchParams({ urls });
  const es = new EventSource('/api/drive-import?' + params.toString());
  _driveImportES = es;

  es.onmessage = e => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }
    if (data.type === 'done') {
      es.close(); _driveImportES = null;
      _driveLog('✓ All done — reloading episodes…', 'done_file');
      btn.textContent = canReset ? 'Import' : 'Scan';
      btn.disabled = false;
      cancelBtn.disabled = false;
      cancelBtn.textContent = 'Close';
      if (scanBtn) scanBtn.disabled = false;
      loadEpisodeList();
    } else if (data.type === 'error') {
      _driveLog('⚠ ' + data.msg, 'error');
    } else if (data.type === 'done_file') {
      _driveLog('✓ ' + data.msg, 'done_file');
    } else if (data.type === 'skipped') {
      _driveLog('— ' + data.msg, 'skipped');
    } else {
      _driveLog(data.msg, 'info');
    }
  };

  es.onerror = () => {
    _driveLog('Connection lost — import may still be running on server.', 'error');
    es.close(); _driveImportES = null;
    btn.disabled = false;
    btn.textContent = canReset ? 'Import' : 'Scan';
    cancelBtn.disabled = false;
    if (scanBtn) scanBtn.disabled = false;
  };
}

const CHUNK_SIZE = 50 * 1024 * 1024; // 50 MB — safely under Railway's proxy limit

function uploadChunk(uploadId, index, chunk) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append('upload_id', uploadId);
    form.append('chunk_index', index);
    form.append('chunk', chunk);
    const xhr = new XMLHttpRequest();
    xhr.addEventListener('load', () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error(`Chunk ${index} failed (${xhr.status})`));
    });
    xhr.addEventListener('error', () => reject(new Error('Network error on chunk ' + index)));
    xhr.open('POST', '/api/upload-chunk');
    xhr.send(form);
  });
}

async function uploadOneFile(file, title, onProgress) {
  const uploadId = crypto.randomUUID();
  const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
  let bytesUploaded = 0;

  for (let i = 0; i < totalChunks; i++) {
    const start = i * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, file.size);
    await uploadChunk(uploadId, i, file.slice(start, end));
    bytesUploaded += (end - start);
    onProgress(Math.round(bytesUploaded / file.size * 100), false);
  }

  onProgress(100, true); // signal "transcribing" phase
  const res = await fetch('/api/finalize-upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ upload_id: uploadId, filename: file.name, title, total_chunks: totalChunks })
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Finalization failed');
  return data;
}

async function submitUpload() {
  if (!uploadQueue.length) return;
  const btn = document.getElementById('upload-submit-btn');
  const cancelBtn = document.getElementById('upload-cancel-btn');
  const status = document.getElementById('upload-status');
  const progressBar = document.getElementById('upload-progress');
  const progressFill = document.getElementById('upload-progress-fill');

  btn.disabled = true;
  cancelBtn.disabled = true;
  progressBar.classList.add('visible');

  const statuses = {};
  const singleTitle = uploadQueue.length === 1 ? document.getElementById('upload-title').value.trim() : '';
  let hadError = false;

  for (let i = 0; i < uploadQueue.length; i++) {
    const file = uploadQueue[i];
    const title = singleTitle || file.name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');
    statuses[i] = 'uploading';
    renderQueueList(statuses);
    const label = uploadQueue.length > 1 ? `File ${i+1} of ${uploadQueue.length}: ` : '';
    try {
      await uploadOneFile(file, title, (pct, transcribing) => {
        progressFill.style.width = transcribing ? '100%' : pct + '%';
        status.textContent = transcribing ? `${label}Transcribing...` : `${label}Uploading... ${pct}%`;
      });
      statuses[i] = 'done';
      renderQueueList(statuses);
      loadStats();
    } catch(e) {
      statuses[i] = 'error';
      renderQueueList(statuses);
      status.style.color = 'var(--red)';
      status.textContent = `${file.name}: ${e.message}`;
      hadError = true;
      // Continue with remaining files
    }
    progressFill.style.width = '0%';
  }

  if (!hadError) {
    document.getElementById('upload-form-view').style.display = 'none';
    document.getElementById('upload-success-view').style.display = '';
  } else {
    cancelBtn.disabled = false;
    progressBar.classList.remove('visible');
  }
}

function showUploadError(msg) {
  document.getElementById('upload-submit-btn').disabled = false;
  document.getElementById('upload-progress').classList.remove('visible');
  const status = document.getElementById('upload-status');
  status.style.color = 'var(--red)';
  status.textContent = msg;
}

async function saveVideoBlob(blob, filename) {
  const file = new File([blob], filename, { type: 'video/mp4' });
  // On iOS/Android: use Web Share API → triggers "Save to Camera Roll" option
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      return;
    } catch(e) {
      if (e.name === 'AbortError') return; // user dismissed share sheet — not an error
      // Fall through to regular download on other errors
    }
  }
  // Desktop fallback: trigger download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── CLIP VIEWER & TRIMMER ─────────────────────────────────────────────────────

const trimState = {
  filename: null, duration: 0, startFrac: 0, endFrac: 1, dragging: null,
  clipOffset: 0,    // absolute start time in original video where the loaded blob begins
  viewStart: 0,     // visible fraction of clip timeline (for pinch-zoom)
  viewEnd: 1,
  blobUrl: null,    // object URL for the 720p preview blob
  filmstripVS: 0,   // viewStart at time of last filmstrip draw
  filmstripVE: 1    // viewEnd at time of last filmstrip draw
};

function fmtSecs(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
function parseTsSecs(str) {
  const p = str.split(':').map(Number);
  return p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+(p[1]||0);
}

function addAllClipButtons(containerEl, text) {
  // Don't double-add
  if (containerEl.querySelector('.view-clip-btn, .clip-chips-row')) return;

  // Match "Ep 880 @ 07:37", "Ep 1014, 00:10:55", "Ep 880 @ 7:37" etc.
  const re = /\bEp\s+(\d{3,5})[,\s@]+(\d{1,2}:\d{2}(?::\d{2})?)\b/g;
  const seen = new Set();
  const clips = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    const epNum = m[1];
    const tsStr = m[2];
    const key = `${epNum}_${tsStr}`;
    if (seen.has(key)) continue;
    seen.add(key);
    const secs = parseTsSecs(tsStr);
    // Find best matching result: same episode number, has video, closest timestamp
    const match =
      currentResults.find(r => {
        const n = (r.episode_title || '').match(/\b(\d{3,5})\b/);
        return n && n[1] === epNum && r.has_video && Math.abs((r.start_secs || 0) - secs) < 15;
      }) ||
      currentResults.find(r => {
        const n = (r.episode_title || '').match(/\b(\d{3,5})\b/);
        return n && n[1] === epNum && r.has_video;
      });
    if (match) clips.push({ epNum, tsStr, filename: match.video_filename, secs });
  }

  // Fallback: if no structured citations found but there's a video context + any timestamp
  if (!clips.length) {
    if (!currentVideoContext) return;
    const fm = text.match(/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/);
    if (!fm) return;
    const secs = parseTsSecs(fm[1]);
    const btn = document.createElement('button');
    btn.className = 'view-clip-btn';
    btn.innerHTML = `<svg width="11" height="13" viewBox="0 0 11 13" fill="none"><polygon points="0,0 11,6.5 0,13" fill="white"/></svg> View Clip at ${fm[1]}`;
    btn.onclick = () => openClipViewer(currentVideoContext.filename, secs);
    containerEl.appendChild(btn);
    return;
  }

  if (clips.length === 1) {
    const btn = document.createElement('button');
    btn.className = 'view-clip-btn';
    btn.innerHTML = `<svg width="11" height="13" viewBox="0 0 11 13" fill="none"><polygon points="0,0 11,6.5 0,13" fill="white"/></svg> View Clip at ${clips[0].tsStr}`;
    btn.onclick = () => openClipViewer(clips[0].filename, clips[0].secs);
    containerEl.appendChild(btn);
    return;
  }

  // Multiple clips — compact chip row
  const wrap = document.createElement('div');
  wrap.className = 'clip-chips-row';
  clips.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'clip-chip-btn';
    btn.innerHTML = `<svg width="9" height="11" viewBox="0 0 11 13" fill="none"><polygon points="0,0 11,6.5 0,13" fill="white"/></svg> Ep ${c.epNum} · ${c.tsStr}`;
    btn.onclick = () => openClipViewer(c.filename, c.secs);
    wrap.appendChild(btn);
  });
  containerEl.appendChild(wrap);
}

async function openClipViewer(filename, startSecs) {
  // Reset state
  trimState.filename   = filename;
  trimState.startFrac  = 0;
  trimState.endFrac    = 1;
  trimState.viewStart  = 0;
  trimState.viewEnd    = 1;
  trimState.clipOffset = 0;
  if (trimState.blobUrl) { URL.revokeObjectURL(trimState.blobUrl); trimState.blobUrl = null; }

  const viewer  = document.getElementById('clip-viewer');
  const video   = document.getElementById('clip-video');
  const loading = document.getElementById('clip-loading');

  // Stop any other playing videos
  ['video-player', 'inline-video-player'].forEach(id => {
    const v = document.getElementById(id); if (v) v.pause();
  });

  viewer.classList.add('open');
  const loadingLabel = document.getElementById('clip-loading-label');
  if (loadingLabel) loadingLabel.textContent = 'Generating preview…';
  loading.style.display = 'flex';
  video.style.opacity = '0';

  // 2.5-minute window centred on the timestamp
  const preStart    = Math.max(0, startSecs - 75);
  const preDuration = 150;
  trimState.clipOffset = preStart;

  try {
    // Fetch a small 720p preview blob (~8-15 MB) so every seek is instant
    const res = await fetch(
      `/api/clip/${encodeURIComponent(filename)}?start=${preStart}&duration=${preDuration}&preview=1`
    );
    if (!res.ok) throw new Error('clip fetch failed');

    // Stream with download progress once bytes start flowing
    const contentLength = res.headers.get('Content-Length');
    const total = contentLength ? parseInt(contentLength) : 0;
    const progressBar = document.getElementById('clip-progress-bar');
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0, labelSwitched = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (!labelSwitched) { labelSwitched = true; if (loadingLabel) loadingLabel.textContent = 'Loading preview…'; }
      if (total && progressBar) {
        // Switch to a fill bar once we know the total
        progressBar.style.animation = 'none';
        progressBar.style.left      = '0';
        progressBar.style.width     = Math.min(95, Math.round(received / total * 100)) + '%';
      }
    }
    if (progressBar) { progressBar.style.animation = 'none'; progressBar.style.width = '100%'; }

    const blob = new Blob(chunks, { type: 'video/mp4' });
    trimState.blobUrl = URL.createObjectURL(blob);

    // Load blob — all seeks are now instant (data is in memory)
    video.src = trimState.blobUrl;
    video.load();
    await new Promise((res, rej) => {
      if (video.readyState >= 1) { res(); return; }
      video.addEventListener('loadedmetadata', res, { once: true });
      video.addEventListener('error',          rej, { once: true });
    });
    trimState.duration = video.duration || 0;

    // Default selection: ±60 s around the target moment
    if (trimState.duration > 0) {
      const posInClip     = startSecs - preStart;
      trimState.startFrac = Math.max(0, (posInClip - 60) / trimState.duration);
      trimState.endFrac   = Math.min(1, (posInClip + 60) / trimState.duration);
    }

    // Seek to selection start, then show
    video.currentTime = trimState.startFrac * trimState.duration;
    loading.style.display = 'none';
    video.style.opacity   = '1';

    updateTrimUI();
    // Build filmstrip using a separate video element backed by the same blob
    // (instant seeking — no network round-trip)
    buildFilmstrip(trimState.blobUrl, trimState.duration);
    // Autoplay within selection range
    video.play().catch(() => {});
  } catch(e) {
    if (loadingLabel) loadingLabel.textContent = 'Failed to load clip.';
  }
}

function closeClipViewer() {
  const viewer = document.getElementById('clip-viewer');
  const video  = document.getElementById('clip-video');
  viewer.classList.add('closing');
  video.pause();
  setTimeout(() => {
    viewer.classList.remove('open', 'closing');
    video.src = '';
    if (trimState.blobUrl) { URL.revokeObjectURL(trimState.blobUrl); trimState.blobUrl = null; }
    const overlay = document.getElementById('clip-saved-overlay');
    if (overlay) overlay.style.display = 'none';
  }, 300);
}

function toggleClipPlay() {
  const video = document.getElementById('clip-video');
  if (video.paused) {
    const end = trimState.endFrac * trimState.duration;
    if (video.currentTime >= end) video.currentTime = trimState.startFrac * trimState.duration;
    video.play();
  } else {
    video.pause();
  }
}

function updateTrimUI() {
  const wrap = document.getElementById('clip-filmstrip-wrap');
  if (!wrap) return;
  const W = wrap.offsetWidth, HW = 18;
  const vs = trimState.viewStart, span = trimState.viewEnd - vs;
  // Convert a timeline fraction to a pixel x position within the visible wrap
  const fracToX = f => Math.max(0, Math.min(W, (f - vs) / span * W));
  const lx = fracToX(trimState.startFrac);
  const rx = fracToX(trimState.endFrac);
  document.getElementById('clip-dim-left').style.width    = lx + 'px';
  document.getElementById('clip-dim-right').style.width   = Math.max(0, W - rx) + 'px';
  document.getElementById('clip-handle-left').style.left  = lx + 'px';
  document.getElementById('clip-handle-right').style.left = (rx - HW) + 'px';
  const selL = lx + HW, selW = Math.max(0, rx - lx - HW * 2);
  ['clip-sel-top','clip-sel-bottom'].forEach(id => {
    document.getElementById(id).style.left  = selL + 'px';
    document.getElementById(id).style.width = selW + 'px';
  });
  // Time labels show absolute timestamps in the original video
  const s = trimState.clipOffset + trimState.startFrac * trimState.duration;
  const e = trimState.clipOffset + trimState.endFrac   * trimState.duration;
  document.getElementById('clip-start-label').textContent = fmtSecs(s);
  document.getElementById('clip-dur-label').textContent   = fmtSecs(e - s);
  document.getElementById('clip-end-label').textContent   = fmtSecs(e);
}

function updateFilmstripZoom() {
  // Applies CSS zoom/pan relative to the last-drawn filmstrip range.
  // Gives immediate visual feedback during a pinch; buildFilmstrip redraws
  // sharp frames once the gesture ends.
  const canvas = document.getElementById('clip-filmstrip-canvas');
  if (!canvas) return;
  const dVS   = trimState.filmstripVS ?? 0;
  const dVE   = trimState.filmstripVE ?? 1;
  const dSpan = dVE - dVS;
  const vs    = trimState.viewStart, span = trimState.viewEnd - vs;
  // Relative to the drawn range
  const relVS   = (vs   - dVS) / dSpan;
  const relSpan = span / dSpan;
  canvas.style.width = (100 / relSpan) + '%';
  canvas.style.left  = -(relVS / relSpan * 100) + '%';
}

async function buildFilmstrip(blobUrl, duration) {
  const canvas = document.getElementById('clip-filmstrip-canvas');
  const wrap   = document.getElementById('clip-filmstrip-wrap');
  if (!canvas || !wrap || !blobUrl || !duration) return;

  const vs = trimState.viewStart, ve = trimState.viewEnd;
  const ctx = canvas.getContext('2d');
  const FH  = 60, FW = 40;                   // narrower tiles → more frames visible
  const n   = Math.max(4, Math.floor(wrap.offsetWidth / FW));

  canvas.width  = n * FW;                     // canvas exactly fits n tiles
  canvas.height = FH;
  canvas.style.width = '100%';
  canvas.style.left  = '0';

  // Fill background while frames load
  ctx.fillStyle = '#1c1c1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Separate video element backed by the same blob → instant seeking, no network.
  // Must be in the DOM for iOS Safari to allow seeking and frame decoding.
  const tmp = document.createElement('video');
  tmp.muted        = true;
  tmp.playsInline  = true;
  tmp.preload      = 'auto';
  tmp.style.cssText = 'position:fixed;top:-200%;left:-200%;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(tmp);
  tmp.src = blobUrl;

  // Wait for enough data to seek (canplay > loadedmetadata on iOS)
  if (tmp.readyState < 3) {
    await new Promise(r => {
      tmp.addEventListener('canplay', r, { once: true });
      tmp.load();
    });
  }

  // Seek helper with 1.5 s fallback so a stalled seek never blocks the loop
  const seekTo = (t) => new Promise(resolve => {
    const tid = setTimeout(resolve, 1500);
    tmp.addEventListener('seeked', () => { clearTimeout(tid); resolve(); }, { once: true });
    tmp.currentTime = t;
  });

  for (let i = 0; i < n; i++) {
    const frac = vs + (i / n) * (ve - vs);
    await seekTo(frac * duration);
    // Draw tile; a thin separator keeps tiles visually distinct
    ctx.drawImage(tmp, i * FW, 0, FW, FH);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(i * FW, 0, 1, FH);
  }
  tmp.src = '';
  document.body.removeChild(tmp);

  trimState.filmstripVS = vs;
  trimState.filmstripVE = ve;
}

async function downloadTrimmedClip() {
  const btn = document.querySelector('.clip-dl-btn');
  const orig = btn.textContent;
  btn.textContent = 'Preparing…';
  btn.disabled = true;
  // Absolute positions in the original video
  const absStart = trimState.clipOffset + trimState.startFrac * trimState.duration;
  const duration = (trimState.endFrac - trimState.startFrac) * trimState.duration;
  try {
    const res = await fetch(`/api/clip/${encodeURIComponent(trimState.filename)}?start=${absStart}&duration=${duration}`);
    if (!res.ok) throw new Error('Failed');
    await saveVideoBlob(await res.blob(), `clip_${Math.floor(absStart)}s.mp4`);
    // Show "Clip Saved" confirmation overlay
    const overlay = document.getElementById('clip-saved-overlay');
    if (overlay) overlay.style.display = 'flex';
  } catch { alert('Download failed.'); }
  finally { btn.textContent = orig; btn.disabled = false; }
}

function initTrimHandles() {
  const wrap       = document.getElementById('clip-filmstrip-wrap');
  const lh         = document.getElementById('clip-handle-left');
  const rh         = document.getElementById('clip-handle-right');
  const video      = document.getElementById('clip-video');
  const videoWrap  = document.querySelector('.clip-video-wrap');
  const speedBadge = document.getElementById('clip-speed-badge');
  const getX = e => e.touches ? e.touches[0].clientX : e.clientX;

  // ── Timeline scrub (tap / drag anywhere on filmstrip outside handles) ────────
  let scrubbing = false;

  const scrubToX = (clientX) => {
    if (!trimState.duration) return;
    const rect = wrap.getBoundingClientRect();
    const vs = trimState.viewStart, span = trimState.viewEnd - vs;
    const frac = Math.max(0, Math.min(1, vs + (clientX - rect.left) / rect.width * span));
    video.currentTime = frac * trimState.duration;
  };

  wrap.addEventListener('mousedown', e => {
    if (trimState.dragging) return; // handle grabbed its own event first
    scrubbing = true;
    video.pause();
    scrubToX(e.clientX);
  });
  wrap.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || trimState.dragging) return;
    scrubbing = true;
    video.pause();
    scrubToX(e.touches[0].clientX);
  }, { passive: true });

  // ── Handle drag ──────────────────────────────────────────────────────────────
  const onMove = e => {
    if (!trimState.dragging && !scrubbing) return;
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const vs = trimState.viewStart, span = trimState.viewEnd - vs;
    const frac = Math.max(0, Math.min(1, vs + (getX(e) - rect.left) / rect.width * span));
    if (trimState.dragging === 'left') {
      trimState.startFrac = Math.min(frac, trimState.endFrac - 0.01);
      updateTrimUI();
      video.currentTime = trimState.startFrac * trimState.duration;
    } else if (trimState.dragging === 'right') {
      trimState.endFrac = Math.max(frac, trimState.startFrac + 0.01);
      updateTrimUI();
      video.currentTime = trimState.endFrac * trimState.duration;
    } else if (scrubbing) {
      scrubToX(getX(e));
    }
  };

  const endDrag = () => {
    if (trimState.dragging && trimState.duration) {
      video.currentTime = trimState.startFrac * trimState.duration;
      video.play().catch(() => {});
    }
    trimState.dragging = null;
    scrubbing = false;
  };

  lh.addEventListener('mousedown',  () => trimState.dragging = 'left');
  rh.addEventListener('mousedown',  () => trimState.dragging = 'right');
  lh.addEventListener('touchstart', () => trimState.dragging = 'left',  { passive: true });
  rh.addEventListener('touchstart', () => trimState.dragging = 'right', { passive: true });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup',   endDrag);
  document.addEventListener('touchend',  endDrag);

  // ── Pinch-to-zoom on filmstrip ────────────────────────────────────────────
  let pinchStartDist = 0, pinchStartVS = 0, pinchStartVE = 1, pinchMidFrac = 0.5;

  wrap.addEventListener('touchstart', e => {
    if (e.touches.length !== 2) return;
    const t0 = e.touches[0], t1 = e.touches[1];
    pinchStartDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    pinchStartVS = trimState.viewStart;
    pinchStartVE = trimState.viewEnd;
    const rect = wrap.getBoundingClientRect();
    const midX = (t0.clientX + t1.clientX) / 2;
    const vs = trimState.viewStart, span = trimState.viewEnd - vs;
    pinchMidFrac = vs + ((midX - rect.left) / rect.width) * span;
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || !pinchStartDist) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist  = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const scale = pinchStartDist / dist;
    const startSpan = pinchStartVE - pinchStartVS;
    const newSpan   = Math.max(0.05, Math.min(1, startSpan * scale));
    const ratio  = newSpan / startSpan;
    let newVS = pinchMidFrac - (pinchMidFrac - pinchStartVS) * ratio;
    let newVE = newVS + newSpan;
    if (newVS < 0) { newVE -= newVS; newVS = 0; }
    if (newVE > 1) { newVS -= (newVE - 1); newVE = 1; }
    trimState.viewStart = Math.max(0, newVS);
    trimState.viewEnd   = Math.min(1, newVE);
    updateTrimUI();
    updateFilmstripZoom();
  }, { passive: false });

  wrap.addEventListener('touchend', e => {
    if (e.touches.length < 2 && pinchStartDist > 0) {
      pinchStartDist = 0;
      if (trimState.blobUrl && trimState.duration) buildFilmstrip(trimState.blobUrl, trimState.duration);
    }
  }, { passive: true });

  // ── Hold-left = rewind · Hold-right = 2× speed ──────────────────────────────
  let holdTimer = null, rewindInt = null, holdIsLeft = false, holdWasPaused = false;

  const activateHold = (isLeft) => {
    if (isLeft) {
      video.pause();
      if (speedBadge) { speedBadge.textContent = '«'; speedBadge.classList.add('visible'); }
      rewindInt = setInterval(() => {
        video.currentTime = Math.max(
          trimState.startFrac * (trimState.duration || 0),
          video.currentTime - 0.25
        );
      }, 50);
    } else {
      if (speedBadge) { speedBadge.textContent = '2×'; speedBadge.classList.add('visible'); }
      video.playbackRate = 2;
      if (video.paused) video.play().catch(() => {});
    }
  };

  const cancelHold = () => {
    clearTimeout(holdTimer); holdTimer = null;
    if (rewindInt) { clearInterval(rewindInt); rewindInt = null; }
    if (video.playbackRate !== 1) video.playbackRate = 1;
    if (speedBadge) speedBadge.classList.remove('visible');
  };

  const releaseHold = () => {
    const wasRewinding = !!rewindInt;
    const was2x = video.playbackRate === 2;
    cancelHold();
    if (wasRewinding && !holdWasPaused) video.play().catch(() => {});
    if (was2x && holdWasPaused) video.pause();
  };

  const startHold = (clientX) => {
    const rect = videoWrap.getBoundingClientRect();
    holdIsLeft    = (clientX - rect.left) < rect.width / 2;
    holdWasPaused = video.paused;
    holdTimer = setTimeout(() => activateHold(holdIsLeft), 150);
  };

  videoWrap.addEventListener('mousedown',   e => startHold(e.clientX));
  videoWrap.addEventListener('mouseup',     releaseHold);
  videoWrap.addEventListener('mouseleave',  releaseHold);
  videoWrap.addEventListener('touchstart',  e => { if (e.touches.length === 1) startHold(e.touches[0].clientX); }, { passive: true });
  videoWrap.addEventListener('touchend',    releaseHold, { passive: true });
  videoWrap.addEventListener('touchcancel', releaseHold, { passive: true });

  // ── Playhead tracking ────────────────────────────────────────────────────────
  video.addEventListener('timeupdate', () => {
    if (!trimState.duration) return;
    const frac = video.currentTime / trimState.duration;
    const W    = wrap.offsetWidth;
    const vs = trimState.viewStart, span = trimState.viewEnd - vs;
    document.getElementById('clip-playhead').style.left = ((frac - vs) / span * W) + 'px';
    if (video.currentTime >= trimState.endFrac * trimState.duration) video.pause();
  });
  video.addEventListener('play',  () => document.getElementById('clip-play-btn').textContent = 'Pause');
  video.addEventListener('pause', () => document.getElementById('clip-play-btn').textContent = 'Play');
}
initTrimHandles();

function scrollToBottom() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = s.scrollHeight, 50);
}
function scrollToTop() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = 0, 50);
}

// Keyboard: track the visual viewport exactly — both its height AND its
// offsetTop (which iOS changes when it scrolls to show a focused input).
// #main-screen follows the visual viewport so the in-flow input bar always
// sits at the bottom of the visible area, just above the keyboard.
const _mainScreen = document.getElementById('main-screen');

function _pinHeight() {
  if (window.visualViewport) {
    const vv = window.visualViewport;
    _mainScreen.style.top    = vv.offsetTop + 'px';
    _mainScreen.style.height = vv.height    + 'px';
  } else {
    _mainScreen.style.top    = '0px';
    _mainScreen.style.height = window.innerHeight + 'px';
  }
}
_pinHeight();
window.addEventListener('resize', _pinHeight, { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', _pinHeight, { passive: true });
  window.visualViewport.addEventListener('scroll', _pinHeight, { passive: true });
}
// Prevent body scroll — only scroll-area/sidebar should scroll
document.body.addEventListener('touchmove', function(e) {
  if (!e.target.closest('.scroll-area, .sidebar-list')) e.preventDefault();
}, { passive: false });

// ── SWIPE GESTURES ────────────────────────────────────────────────────────────
(function() {
  let _tx = 0, _ty = 0, _swiping = false;
  const THRESHOLD = 60, ANGLE = 35;

  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    _tx = e.touches[0].clientX;
    _ty = e.touches[0].clientY;
    _swiping = true;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!_swiping) return;
    _swiping = false;
    const dx = e.changedTouches[0].clientX - _tx;
    const dy = e.changedTouches[0].clientY - _ty;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);

    // Swipe down on scroll area — dismiss keyboard
    if (dy > THRESHOLD && absDx < absDy * Math.tan(ANGLE * Math.PI / 180)) {
      if (e.target.closest('.scroll-area')) {
        document.getElementById('search-input').blur();
      }
      return;
    }

    // Only horizontal swipes from here
    if (absDx < THRESHOLD || absDy > absDx * Math.tan(ANGLE * Math.PI / 180)) return;

    const sidebar = document.getElementById('sidebar');
    const isOpen  = sidebar.classList.contains('open');

    // Right swipe from left edge — open sidebar (mobile only)
    if (dx > 0 && _tx < 40 && !isOpen && window.innerWidth < 768) {
      toggleSidebar();
    }
    // Left swipe — close sidebar (mobile only)
    if (dx < 0 && isOpen && window.innerWidth < 768) {
      toggleSidebar();
    }
  }, { passive: true });
})();

(async function() {
  try {
    const res = await fetch('/api/stats');
    if (res.ok) {
      const data = await res.json();
      const login = document.getElementById('login-screen');
      const main  = document.getElementById('main-screen');
      login.style.display = 'none';
      main.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
      initEmptyState();
      document.getElementById('search-input').focus();
    } else {
      const login = document.getElementById('login-screen');
      login.style.opacity = '1';
    }
  } catch(e) {
    document.getElementById('login-screen').style.opacity = '1';
  }
})();

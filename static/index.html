<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFBrain">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/apple-touch-icon.png">
<title>AFBrain</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

:root {
  --bg-primary: #000000;
  --bg-secondary: #1c1c1e;
  --bg-tertiary: #2c2c2e;
  --separator: rgba(84,84,88,0.65);
  --red: #ff453a;
  --orange: #ff9f0a;
  --label: #ffffff;
  --label-secondary: rgba(235,235,245,0.6);
  --label-tertiary: rgba(235,235,245,0.3);
  --label-quaternary: rgba(235,235,245,0.16);
  --fill: rgba(120,120,128,0.36);
  --radius: 12px;
  --radius-lg: 16px;
  --sf: -apple-system, 'Helvetica Neue', sans-serif;
  --sf-mono: 'SF Mono', 'Menlo', monospace;
}

html {
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg-primary);
  color: var(--label);
  font-family: var(--sf);
  height: 100%;
  overflow: hidden;
  position: fixed;
  width: 100%;
  font-size: 17px;
  line-height: 1.47;
}

/* ── LOGIN ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: 0 24px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 40px;
}
.login-logo span { color: var(--red); }
.login-field {
  background: var(--bg-secondary);
  border: none;
  border-radius: var(--radius);
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  padding: 14px 16px;
  width: 100%;
  outline: none;
  margin-bottom: 12px;
  -webkit-appearance: none;
}
.login-field::placeholder { color: var(--label-tertiary); }
.login-btn {
  width: 100%;
  height: 50px;
  background: var(--red);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: var(--sf);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
  transition: opacity 0.15s;
}
.login-btn:active { opacity: 0.8; }
.login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ── MAIN LAYOUT ── */
#main-screen {
  display: none;
  flex-direction: column;
  position: fixed;
  inset: 0;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}

/* ── HEADER — full bleed, inner content capped ── */
.app-header {
  width: 100%;
  flex-shrink: 0;
  padding: calc(env(safe-area-inset-top) + 14px) 0 14px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--separator);
}
.header-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.sidebar-btn:hover { color: var(--label); }

/* ── SIDEBAR ── */
.sidebar {
  position: fixed;
  top: 0; left: -300px;
  width: 280px;
  height: 100%;
  background: #111;
  border-right: 0.5px solid var(--separator);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: left 0.25s ease;
}
.sidebar.open { left: 0; }
.sidebar-head {
  padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
  border-bottom: 0.5px solid var(--separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.sidebar-head-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sidebar-close {
  background: none;
  border: none;
  color: var(--label-tertiary);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.sidebar-search {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--separator);
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  background: var(--bg-secondary);
  border: none;
  border-radius: 8px;
  color: var(--label);
  font-family: var(--sf);
  font-size: 14px;
  padding: 8px 10px;
  outline: none;
}
.sidebar-search input::placeholder { color: var(--label-tertiary); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-list::-webkit-scrollbar { width: 0; }
.ep-item {
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 8px;
  margin: 2px 8px;
  transition: background 0.1s;
}
.ep-item:hover { background: var(--bg-secondary); }
.ep-item.active { background: rgba(255,69,58,0.15); }
.ep-item-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--red);
  margin-bottom: 2px;
}
.ep-item-title {
  font-size: 12px;
  color: var(--label-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 199;
}
#sidebar-backdrop.visible { display: block; }

/* ── LOCKED EPISODE PILL ── */
.locked-ep-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,69,58,0.15);
  border-radius: 20px;
  padding: 5px 10px 5px 12px;
  font-size: 13px;
  color: var(--red);
  margin-bottom: 8px;
}
.locked-ep-pill button {
  background: none;
  border: none;
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  opacity: 0.7;
}
.locked-ep-pill button:hover { opacity: 1; }
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 1;
  letter-spacing: -0.5px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.app-title:active { opacity: 0.7; }
.app-title span { color: var(--red); }
.ep-badge { font-size: 13px; color: var(--label-secondary); }
.ep-badge strong { color: var(--red); font-weight: 600; }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 0;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  max-width: 720px;
}
.scroll-area::-webkit-scrollbar { width: 0; }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 1px;
  color: var(--label-secondary);
  margin-bottom: 10px;
}
.empty-sub { font-size: 15px; color: var(--label-tertiary); line-height: 1.5; }

/* ── SECTION HEADER ── */
.section-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 4px 0 8px;
}

/* ── AI CARD ── */
.ai-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body h3 {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-quaternary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin: 16px 0 4px;
}
.ai-body ul, .ai-body ol { padding-left: 18px; }
.ai-body li { margin-bottom: 4px; color: var(--label-secondary); }
.ai-body blockquote {
  border-left: 2px solid var(--red);
  padding: 2px 0 2px 12px;
  margin: 6px 0;
  color: var(--label);
  font-style: normal;
}
.ai-body p { margin-bottom: 6px; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body strong { color: var(--label); font-weight: 600; }
.ai-body hr { border: none; border-top: 0.5px solid var(--separator); margin: 12px 0; }

/* ── VIEW TRANSCRIPTS BUTTON ── */
.view-transcripts-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  cursor: pointer;
  margin-top: 4px;
  margin-bottom: 8px;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-transcripts-btn:hover { background: #3a3a3c; }

/* ── TRANSCRIPTS PANEL ── */
.transcripts-panel { display: none; margin-bottom: 12px; }
.transcripts-panel.open { display: block; }

/* ── CHAT ── */
.chat-item {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-top: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-q-label {
  font-size: 15px;
  line-height: 1.65;
  color: var(--red);
  margin-bottom: 10px;
  white-space: pre-wrap;
}
.chat-a-body {
  font-size: 15px;
  line-height: 1.65;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-a-body blockquote { border-left: 3px solid var(--red); padding-left: 12px; margin: 8px 0; font-style: italic; color: var(--label-secondary); }
.chat-a-body p { margin-bottom: 6px; }
.chat-a-body strong { color: var(--label); }
.chat-a-body ul, .chat-a-body ol { padding-left: 20px; }
.chat-a-body li { margin-bottom: 4px; }

/* ── VIEW EPISODE BUTTON ── */
.view-ep-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 13px;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-ep-btn:hover { background: #3a3a3c; }
.ep-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ── RESULT CARDS ── */
.result-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.result-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
  flex-wrap: wrap;
}
.result-ep {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-tertiary);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  min-width: 0;
}
.result-ts { font-family: var(--sf-mono); font-size: 12px; color: var(--red); flex-shrink: 0; }
.result-speaker { font-size: 11px; color: var(--label-quaternary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
.result-text { font-size: 15px; line-height: 1.55; color: var(--label-secondary); word-wrap: break-word; overflow-wrap: break-word; }
.result-text mark { background: transparent; color: var(--orange); font-weight: 500; }

/* ── BOTTOM INPUT AREA ── */
.input-area {
  flex-shrink: 0;
  padding: 12px 20px;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--separator);
  width: 100%;
  max-width: 720px;
}
.input-bar {
  display: flex;
  align-items: flex-end;
  background: var(--bg-secondary);
  border-radius: 22px;
  padding: 6px 6px 6px 16px;
  gap: 8px;
  min-height: 44px;
}
.input-bar textarea {
  flex: 1;
  background: none;
  border: none;
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  outline: none;
  -webkit-appearance: none;
  min-width: 0;
  padding: 5px 0;
  resize: none;
  overflow-y: hidden;
  line-height: 1.4;
  max-height: 160px;
  overflow-y: auto;
}
.input-bar textarea::placeholder { color: var(--label-tertiary); }
.input-submit {
  background: var(--red);
  border: none;
  border-radius: 50%;
  color: #fff;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
  transition: opacity 0.15s;
  -webkit-appearance: none;
}
.input-submit:active { opacity: 0.7; }
.input-submit:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--fill);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-row { display: flex; align-items: center; padding: 14px 0; font-size: 14px; color: var(--label-tertiary); }
.scroll-bottom-pad { height: 20px; }

/* ── UPLOAD MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 400;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 100%;
  max-width: 400px;
}
.modal-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 16px;
}
.modal-field {
  width: 100%;
  background: var(--bg-tertiary);
  border: none;
  border-radius: var(--radius);
  color: var(--label);
  font-family: var(--sf);
  font-size: 15px;
  padding: 12px 14px;
  outline: none;
  margin-bottom: 10px;
  -webkit-appearance: none;
}
.modal-field::placeholder { color: var(--label-tertiary); }
.file-drop {
  border: 1.5px dashed var(--separator);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 14px;
  transition: border-color 0.15s;
}
.file-drop:hover { border-color: var(--red); }
.file-drop.has-file { border-color: var(--red); background: rgba(255,69,58,0.06); }
.file-drop-label { font-size: 14px; color: var(--label-tertiary); }
.file-drop-label strong { color: var(--label-secondary); }
.modal-row { display: flex; gap: 10px; }
.modal-btn {
  flex: 1;
  height: 44px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--sf);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
}
.modal-btn-primary { background: var(--red); color: #fff; }
.modal-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-btn-cancel { background: var(--bg-tertiary); color: var(--label-secondary); }
.modal-status { font-size: 13px; color: var(--label-secondary); margin-top: 10px; min-height: 18px; text-align: center; }

/* ── VIDEO PLAYER PANEL ── */
.video-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #000;
  z-index: 350;
  transform: translateY(100%);
  transition: transform 0.25s ease;
  max-height: 60vh;
  display: flex;
  flex-direction: column;
}
.video-panel.open { transform: translateY(0); }
.video-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border-top: 0.5px solid var(--separator);
  flex-shrink: 0;
}
.video-panel-title { font-size: 13px; font-weight: 600; color: var(--label); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-panel-ts { font-family: var(--sf-mono); font-size: 12px; color: var(--red); margin: 0 12px; flex-shrink: 0; }
.video-panel-close { background: none; border: none; color: var(--label-tertiary); font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0; }
.video-panel video { width: 100%; flex: 1; min-height: 0; display: block; background: #000; }
.play-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,69,58,0.12);
  border: none;
  border-radius: 6px;
  color: var(--red);
  font-family: var(--sf);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  cursor: pointer;
  margin-left: 8px;
  flex-shrink: 0;
  -webkit-appearance: none;
}
.play-btn:hover { background: rgba(255,69,58,0.22); }
.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(120,120,128,0.18);
  border: none;
  border-radius: 6px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  cursor: pointer;
  margin-left: 4px;
  flex-shrink: 0;
  -webkit-appearance: none;
  text-decoration: none;
}
.download-btn:hover { background: rgba(120,120,128,0.3); }
.upload-btn {
  background: none;
  border: none;
  color: var(--label-secondary);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.upload-btn:hover { color: var(--label); }
.delete-ep-btn {
  background: none;
  border: none;
  color: var(--label-quaternary);
  font-size: 12px;
  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
  flex-shrink: 0;
}
.delete-ep-btn:hover { color: var(--red); }

/* ── UPLOAD PROGRESS ── */
.upload-progress {
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 14px;
  display: none;
}
.upload-progress.visible { display: block; }
.upload-progress-fill {
  height: 100%;
  background: var(--red);
  width: 0%;
  transition: width 0.2s ease;
  border-radius: 2px;
}
.upload-success-view { text-align: center; padding: 10px 0 4px; }
.upload-success-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; color: var(--label); }

/* ── VIDEO SIDEBAR ITEM ── */
.ep-item-video-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--red);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span>AF</span>BRAIN</div>
    <input class="login-field" type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Continue</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal-box">
    <!-- Form view -->
    <div id="upload-form-view">
      <div class="modal-title">Upload Video</div>
      <input class="modal-field" type="text" id="upload-title" placeholder="Title (auto-detected from filename)">
      <div class="file-drop" id="file-drop" onclick="document.getElementById('video-file-input').click()">
        <div class="file-drop-label" id="file-drop-label"><strong>Choose MP4(s)</strong> or drag and drop</div>
        <input type="file" id="video-file-input" accept=".mp4" multiple style="display:none" onchange="onFileSelected(this)">
      </div>
      <div id="upload-queue-list" style="display:none;margin-bottom:10px;max-height:110px;overflow-y:auto"></div>
      <div class="upload-progress" id="upload-progress">
        <div class="upload-progress-fill" id="upload-progress-fill"></div>
      </div>
      <div class="modal-row">
        <button class="modal-btn modal-btn-cancel" id="upload-cancel-btn" onclick="closeUploadModal()">Cancel</button>

<script>
let currentResults = [];
let chatHistory = [];
let currentQuery = '';
let analyzing = false;
let hasResults = false;
let lockedEpisode = null;   // episode number string when browsing a specific episode
let allEpisodes = [];        // cached episode list for sidebar filtering

document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw}) });
    if (res.ok) {
      const login = document.getElementById('login-screen');
      const main  = document.getElementById('main-screen');
      login.style.opacity = '0';
      setTimeout(() => {
        login.style.display = 'none';
        main.style.display = 'flex';
        requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
      }, 200);
      loadStats();
      document.getElementById('search-input').focus();
    } else {
      err.textContent = 'Incorrect password.';
      document.getElementById('pw-input').value = '';
    }
  } catch(e) { err.textContent = 'Connection error.'; }
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('ep-count').textContent = data.episodes.toLocaleString();
  } catch(e) {}
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  const opening = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('visible');
  if (opening) {
    loadEpisodeList();
    document.getElementById('sidebar-search-input').value = '';
  }
}

async function loadEpisodeList() {
  try {
    const res = await fetch('/api/episodes');
    const data = await res.json();
    allEpisodes = data.episodes || [];
    renderEpisodeList(allEpisodes);
  } catch(e) {
    document.getElementById('episode-list').innerHTML =
      '<div style="padding:20px;color:var(--label-tertiary);font-size:13px">Failed to load.</div>';
  }
}

function formatEpSubtitle(title) {
  // Strip "Ep 1016 - " or "Ep_1016_" or "Ep_01_" prefix and file extension
  let s = title
    .replace(/^Ep[\s_]*\d+[\s_]*[-–]?[\s_]*/i, '')
    .replace(/\.(mp3|mp4|m4a|docx|wav)$/i, '');
  // Parse date: MM.DD.YYYY, MM.DD.YY, or MM_DD_YY, M_D_YY (underscores or dots)
  const dm = s.match(/^(\d{1,2})[._](\d{1,2})[._](\d{2,4})[_\s]?/);
  let dateStr = '';
  if (dm) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const year = dm[3].length === 2 ? '20' + dm[3] : dm[3];
    dateStr = `${months[parseInt(dm[1],10)-1]} ${parseInt(dm[2],10)}, ${year}`;
    s = s.slice(dm[0].length);
  }
  // Identify show type
  let show = /q&af/i.test(s) ? 'Q&AF' : /cti/i.test(s) ? 'CTI' : '';
  return dateStr ? (show ? `${show} · ${dateStr}` : dateStr) : show || title;
}

function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function renderEpisodeList(episodes) {
  const list = document.getElementById('episode-list');
  if (!episodes.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--label-tertiary);font-size:13px">No episodes.</div>';
    return;
  }
  const sorted = [...episodes].sort((a, b) => {
    const na = parseInt(a.title.match(/(\d+)/)?.[1] || '0', 10);
    const nb = parseInt(b.title.match(/(\d+)/)?.[1] || '0', 10);
    return nb - na;
  });
  list.innerHTML = sorted.map(ep => {
    if (ep.has_video) {
      const epId = ep.video_filename ? ep.video_filename.replace(/\.[^.]+$/, '') : ep.id;
      const dateLabel = ep.uploaded_at ? formatDateDisplay(ep.uploaded_at) : 'Video';
      const deleteBtn = `<button class="delete-ep-btn" onclick="event.stopPropagation();deleteEpisode('${ep.id}')" title="Delete episode">✕</button>`;
      const safeTitle = ep.title.replace(/'/g, "\\'").replace(/</g, '&lt;');
      const safeFilename = (ep.video_filename || '').replace(/'/g, "\\'");
      return `<div class="ep-item" style="display:flex;align-items:center;gap:4px" onclick="openVideoEpisode('${safeFilename}','${safeTitle}','${epId}')">
        <div style="flex:1;min-width:0">
          <div class="ep-item-video-title">▶ ${ep.title.replace(/</g,'&lt;')}</div>
          <div class="ep-item-title">${dateLabel}</div>
        </div>
        ${deleteBtn}
      </div>`;
    }
    const num = ep.title.match(/(\d+)/)?.[1] || '';
    const subtitle = formatEpSubtitle(ep.title);
    const clean = ep.title.replace(/\.(mp3|mp4|m4a|docx)$/i, '').replace(/[_-]/g, ' ').trim();
    const isActive = lockedEpisode === num;
    return `<div class="ep-item${isActive ? ' active' : ''}" style="display:flex;align-items:center;gap:4px" onclick="loadEpisode('${num}', '${clean.replace(/'/g,"\\'")}')">
      <div style="flex:1;min-width:0">
        <div class="ep-item-num">Ep ${num}</div>
        <div class="ep-item-title">${subtitle}</div>
      </div>
    </div>`;
  }).join('');
}

function filterEpisodes(query) {
  const q = query.toLowerCase();
  const filtered = q ? allEpisodes.filter(ep =>
    ep.title.toLowerCase().includes(q)
  ) : allEpisodes;
  renderEpisodeList(filtered);
}

function loadEpisode(epNum, title) {
  toggleSidebar();
  lockedEpisode = epNum;
  document.getElementById('locked-pill').style.display = 'block';
  document.getElementById('locked-label').textContent = `Ep ${epNum}`;
  document.getElementById('search-input').placeholder = `Search in Ep ${epNum}...`;
  resetApp(false, false);
  doSearch(`episode ${epNum}`, epNum);
}

function openEpisode(epNum) {
  lockedEpisode = epNum;
  document.getElementById('locked-pill').style.display = 'block';
  document.getElementById('locked-label').textContent = `Ep ${epNum}`;
  document.getElementById('search-input').placeholder = `Search in Ep ${epNum}...`;
  resetApp(false, false);
  doSearch(`episode ${epNum}`, epNum);
}

function addEpisodeButtons(container, text) {
  const matches = [...text.matchAll(/\bEp\s+(\d{3,4})\b/g)];
  const nums = [...new Set(matches.map(m => m[1]))];
  if (!nums.length) return;
  const row = document.createElement('div');
  row.className = 'ep-btn-row';
  nums.forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'view-ep-btn';
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 4L7.5 6L4.5 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg> View Ep ${num}`;
    btn.onclick = () => openEpisode(num);
    row.appendChild(btn);
  });
  container.appendChild(row);
}

function clearLockedEpisode() {
  lockedEpisode = null;
  document.getElementById('locked-pill').style.display = 'none';
  document.getElementById('search-input').placeholder = 'Ask anything...';
  resetApp(false, false);
}

// ── RESET ─────────────────────────────────────────────────────────────────────

function resetApp(clearLock = true, focusInput = true) {
  currentResults = []; chatHistory = []; currentQuery = ''; analyzing = false; hasResults = false;
  if (clearLock) {
    lockedEpisode = null;
    document.getElementById('locked-pill').style.display = 'none';
    document.getElementById('search-input').placeholder = 'Ask anything...';
  }
  searchInput.value = ''; searchInput.style.height = 'auto';
  document.getElementById('results-area').innerHTML = `
    <div class="empty-state">
      <div class="empty-title">Search Andy's Mind</div>
      <div class="empty-sub">Ask about episodes, predictions, stories, quotes, or any topic Andy has covered.</div>
    </div>`;
  if (focusInput) document.getElementById('search-input').focus();
}

const searchInput = document.getElementById('search-input');
function autoResizeInput() {
  searchInput.style.height = 'auto';
  searchInput.style.height = Math.min(searchInput.scrollHeight, 160) + 'px';
}
searchInput.addEventListener('input', autoResizeInput);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); }
});

function handleSubmit() {
  const val = document.getElementById('search-input').value.trim();
  if (!val) return;
  searchInput.value = ''; searchInput.style.height = 'auto';
  if (hasResults) { doFollowup(val); } else { doSearch(val); }
}

async function doSearch(query, episodeFilter) {
  currentQuery = query; chatHistory = []; hasResults = false;
  const area = document.getElementById('results-area');
  area.innerHTML = '<div class="loading-row"><span class="spinner"></span>Searching...</div>';
  try {
    const body = { query };
    const ep = episodeFilter || lockedEpisode;
    if (ep) body.episode_filter = ep;
    const res = await fetch('/api/search', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) return;
    const data = await res.json();
    currentResults = data.results || [];
    renderResults(query, currentResults, !!ep);
  } catch(e) {
    area.innerHTML = '<div class="loading-row">Search failed. Try again.</div>';
  }
}

function renderResults(query, results, autoExpand = false) {
  const area = document.getElementById('results-area');
  if (!results.length) {
    area.innerHTML = `<div class="empty-state"><div class="empty-title">No Results</div><div class="empty-sub">Nothing found for "${query}".</div></div>`;
    return;
  }
  hasResults = true;

  let transcriptHtml = '';
  results.forEach(r => {
    const epShort = r.episode_title.replace(/\.(mp3|mp4|m4a)$/i, '').substring(0, 60);
    const snippet = highlightText(r.text, query);
    const speaker = r.speaker ? `<div class="result-speaker">${r.speaker}</div>` : '';
    const playBtn = r.has_video
      ? `<button class="play-btn" onclick="playVideo('${r.video_filename}','${r.episode_title.replace(/'/g,"\\'")}',${r.start_secs})">▶ ${r.timestamp}</button>`
      : '';
    const dlBtn = r.has_video
      ? `<button class="download-btn" onclick="downloadClip('${r.video_filename}',${r.start_secs})">↓ Clip</button>`
      : '';
    transcriptHtml += `<div class="result-card">
      <div class="result-meta-row">
        <span class="result-ep">${epShort}</span>
        <span style="display:inline-flex;align-items:center;flex-shrink:0">
          ${r.has_video ? playBtn + dlBtn : `<span class="result-ts">${r.timestamp}</span>`}
        </span>
      </div>
      ${speaker}
      <div class="result-text">${snippet}</div>
    </div>`;
  });

  const sectionLabel = autoExpand ? 'AI Summary' : 'AI Analysis';
  const btnLabel = `View Transcripts (${results.length}) &#8964;`;

  let html = `<div class="section-header">${sectionLabel}</div>
  <div id="ai-section">
    <div class="ai-card">
      <div class="chat-q-label">&ldquo;${query.replace(/"/g, '&quot;')}&rdquo;</div>
      <div id="ai-content" class="ai-body"><div class="loading-row"><span class="spinner"></span>Analyzing transcripts...</div></div>
    </div>
    <button class="view-transcripts-btn" id="transcripts-toggle" onclick="toggleTranscripts()">
      ${btnLabel}
    </button>
    <div class="transcripts-panel" id="transcripts-panel">${transcriptHtml}</div>
    <div id="chat-thread"></div>
  </div>`;

  area.innerHTML = html;
  scrollToTop();
  runAnalysis(query, results, autoExpand);
}

function toggleTranscripts() {
  const panel = document.getElementById('transcripts-panel');
  const btn = document.getElementById('transcripts-toggle');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    btn.innerHTML = `Hide Transcripts &#8963;`;
  } else {
    btn.innerHTML = `View Transcripts (${currentResults.length}) &#8964;`;
  }
}

function highlightText(text, query, maxChars=280) {
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 3);
  let bestPos = 0, bestScore = 0;
  const tLower = text.toLowerCase();
  for (let i = 0; i < Math.max(1, text.length - 50); i += 15) {
    const w = tLower.substring(i, i + 200);
    const score = words.filter(w2 => w.includes(w2)).length;
    if (score > bestScore) { bestScore = score; bestPos = i; }
  }
  const start = Math.max(0, bestPos - 30);
  const end = Math.min(text.length, start + maxChars);
  let snippet = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
  snippet = snippet.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  words.forEach(word => {
    const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    snippet = snippet.replace(re, m => `<mark>${m}</mark>`);
  });
  return snippet;
}

async function consumeStream(res, onChunk, onDone, onError) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let sseBuffer = '';
  let fullText = '';
  let displayedLen = 0;
  let streamDone = false;

  const tick = () => {
    if (displayedLen < fullText.length) {
      const behind = fullText.length - displayedLen;
      const speed = behind > 60 ? Math.ceil(behind / 10) : 3;
      displayedLen = Math.min(displayedLen + speed, fullText.length);
      onChunk(fullText.slice(0, displayedLen));
    }
    if (!streamDone || displayedLen < fullText.length) {
      requestAnimationFrame(tick);
    } else {
      onDone(fullText);
    }
  };
  requestAnimationFrame(tick);

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const lines = sseBuffer.split('\n');
      sseBuffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (raw === '[DONE]') { streamDone = true; return; }
        try {
          const parsed = JSON.parse(raw);
          if (parsed.error) { streamDone = true; onError(parsed.error); return; }
          if (parsed.text) fullText += parsed.text;
        } catch {}
      }
    }
    streamDone = true;
  } catch(e) {
    streamDone = true;
    onError(e.message);
  }
}

async function runAnalysis(query, results) {
  if (analyzing) return;
  analyzing = true;
  const el = document.getElementById('ai-content');
  if (!el) { analyzing = false; return; }
  try {
    const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query, results: results.slice(0, 20)}) });
    await consumeStream(res,
      (text) => { el.innerHTML = marked.parse(text); },
      (text) => {
        el.innerHTML = text ? marked.parse(text) : '<span style="color:var(--label-tertiary)">No answer — try rephrasing or adding more context.</span>';
        if (text) { chatHistory.push({q: query, a: text}); addEpisodeButtons(el.parentElement, text); }
      },
      (err) => { el.innerHTML = `<span style="color:var(--label-tertiary)">${err}</span>`; }
    );
  } catch(e) {
    el.innerHTML = '<span style="color:var(--label-tertiary)">Analysis unavailable.</span>';
  }
  analyzing = false;
}

async function doFollowup(question) {
  const thread = document.getElementById('chat-thread');
  if (!thread) return;
  const itemId = `chat-${Date.now()}`;
  thread.innerHTML += `<div class="chat-item" id="${itemId}">
    <div class="chat-q-label">&ldquo;${question.replace(/"/g, '&quot;')}&rdquo;</div>
    <div class="chat-a-body"><div class="loading-row"><span class="spinner"></span>Thinking...</div></div>
  </div>`;
  scrollToBottom();
  try {
    const followupBody = {question, history: chatHistory, original_query: currentQuery};
    if (lockedEpisode) followupBody.episode_filter = lockedEpisode;
    const res = await fetch('/api/followup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(followupBody) });
    const item = document.getElementById(itemId);
    const body = item.querySelector('.chat-a-body');
    body.innerHTML = '';
    await consumeStream(res,
      (text) => { body.innerHTML = marked.parse(text); scrollToBottom(); },
      (text) => {
        body.innerHTML = marked.parse(text || 'No answer — try rephrasing or adding more context.');
        if (text) { chatHistory.push({q: question, a: text}); addEpisodeButtons(item, text); }
        scrollToBottom();
      },
      (err) => { body.textContent = 'Request failed.'; }
    );
  } catch(e) {
    const item = document.getElementById(itemId);
    if (item) item.querySelector('.chat-a-body').textContent = 'Request failed.';
  }
}

// ── UPLOAD ───────────────────────────────────────────────────────────────────

let uploadQueue = [];

function openUploadModal() {
  uploadQueue = [];
  document.getElementById('upload-title').value = '';
  document.getElementById('file-drop-label').innerHTML = '<strong>Choose MP4(s)</strong> or drag and drop';
  document.getElementById('file-drop').classList.remove('has-file');
  document.getElementById('upload-submit-btn').disabled = true;
  document.getElementById('upload-cancel-btn').disabled = false;
  document.getElementById('upload-status').textContent = '';
  document.getElementById('upload-status').style.color = '';
  document.getElementById('upload-progress').classList.remove('visible');
  document.getElementById('upload-progress-fill').style.width = '0%';
  document.getElementById('upload-queue-list').style.display = 'none';
  document.getElementById('upload-queue-list').innerHTML = '';
  document.getElementById('upload-form-view').style.display = '';
  document.getElementById('upload-success-view').style.display = 'none';
  document.getElementById('upload-modal').classList.add('open');
}

function closeUploadModal() {
  document.getElementById('upload-modal').classList.remove('open');
}

function onFileSelected(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  uploadQueue = files;
  const totalMB = (files.reduce((s, f) => s + f.size, 0) / 1024 / 1024).toFixed(1);
  if (files.length === 1) {
    document.getElementById('file-drop-label').innerHTML = `<strong>${files[0].name}</strong><br><span style="font-size:12px">${(files[0].size/1024/1024).toFixed(1)} MB</span>`;
    if (!document.getElementById('upload-title').value)
      document.getElementById('upload-title').value = files[0].name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');
    document.getElementById('upload-title').style.display = '';
  } else {
    document.getElementById('file-drop-label').innerHTML = `<strong>${files.length} videos selected</strong><br><span style="font-size:12px">${totalMB} MB total</span>`;
    document.getElementById('upload-title').style.display = 'none'; // titles auto-derived for bulk
  }
  document.getElementById('file-drop').classList.add('has-file');
  document.getElementById('upload-submit-btn').disabled = false;
  document.getElementById('upload-submit-btn').textContent = files.length > 1 ? `Upload ${files.length} Videos` : 'Upload';
  renderQueueList();
}

function renderQueueList(statuses = {}) {
  const el = document.getElementById('upload-queue-list');
  if (uploadQueue.length <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = uploadQueue.map((f, i) => {
    const s = statuses[i];
    const icon = s === 'done' ? '<span style="color:#34c759">✓</span>'
                : s === 'uploading' ? '<span style="color:var(--red)">↑</span>'
                : s === 'error' ? '<span style="color:var(--red)">✕</span>'
                : '<span style="color:var(--label-quaternary)">○</span>';
    return `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;color:${s==='done'?'var(--label-tertiary)':'var(--label-secondary)'}">
      ${icon}
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
      <span style="color:var(--label-quaternary);flex-shrink:0">${(f.size/1024/1024).toFixed(0)}MB</span>
    </div>`;
  }).join('');
}

// Drag and drop
const fileDrop = document.getElementById('file-drop');
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.style.borderColor = 'var(--red)'; });
fileDrop.addEventListener('dragleave', () => { fileDrop.style.borderColor = ''; });
fileDrop.addEventListener('drop', e => {
  e.preventDefault();
  fileDrop.style.borderColor = '';
  const mp4s = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.mp4'));
  if (mp4s.length) {
    const dt = new DataTransfer();
    mp4s.forEach(f => dt.items.add(f));
    document.getElementById('video-file-input').files = dt.files;
    onFileSelected(document.getElementById('video-file-input'));
  }
});

function uploadOneFile(file, title, onProgress) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append('file', file);
    if (title) form.append('title', title);
    const xhr = new XMLHttpRequest();
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100));
    });
    xhr.addEventListener('load', () => {
      try {
        const data = JSON.parse(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300 && !data.error) resolve(data);
        else reject(new Error(data.error || 'Upload failed'));
      } catch { reject(new Error('Upload failed')); }
    });
    xhr.addEventListener('error', () => reject(new Error('Network error')));
    xhr.open('POST', '/api/upload-video');
    xhr.send(form);
  });
}

async function submitUpload() {
  if (!uploadQueue.length) return;
  const btn = document.getElementById('upload-submit-btn');
  const cancelBtn = document.getElementById('upload-cancel-btn');
  const status = document.getElementById('upload-status');
  const progressBar = document.getElementById('upload-progress');
  const progressFill = document.getElementById('upload-progress-fill');

  btn.disabled = true;
  cancelBtn.disabled = true;
  progressBar.classList.add('visible');

  const statuses = {};
  const singleTitle = uploadQueue.length === 1 ? document.getElementById('upload-title').value.trim() : '';
  let hadError = false;

  for (let i = 0; i < uploadQueue.length; i++) {
    const file = uploadQueue[i];
    const title = singleTitle || file.name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');
    statuses[i] = 'uploading';
    renderQueueList(statuses);
    const label = uploadQueue.length > 1 ? `File ${i+1} of ${uploadQueue.length}: ` : '';
    try {
      await uploadOneFile(file, title, pct => {
        progressFill.style.width = pct + '%';
        status.textContent = pct < 100 ? `${label}Uploading... ${pct}%` : `${label}Transcribing...`;
      });
      statuses[i] = 'done';
      renderQueueList(statuses);
      loadStats();
    } catch(e) {
      statuses[i] = 'error';
      renderQueueList(statuses);
      status.style.color = 'var(--red)';
      status.textContent = `${file.name}: ${e.message}`;
      hadError = true;
      // Continue with remaining files
    }
    progressFill.style.width = '0%';
  }

  if (!hadError) {
    document.getElementById('upload-form-view').style.display = 'none';
    document.getElementById('upload-success-view').style.display = '';
  } else {
    cancelBtn.disabled = false;
    progressBar.classList.remove('visible');
  }
}

function showUploadError(msg) {
  document.getElementById('upload-submit-btn').disabled = false;
  document.getElementById('upload-progress').classList.remove('visible');
  const status = document.getElementById('upload-status');
  status.style.color = 'var(--red)';
  status.textContent = msg;
}

// ── VIDEO PLAYER ──────────────────────────────────────────────────────────────

function playVideo(filename, title, startSecs) {
  const panel = document.getElementById('video-panel');
  const player = document.getElementById('video-player');
  const panelTitle = document.getElementById('video-panel-title');
  const panelTs = document.getElementById('video-panel-ts');
  const src = `/api/video/${encodeURIComponent(filename)}`;
  panelTitle.textContent = title.replace(/\.(mp4|mp3|m4a|docx)$/i, '');
  panelTs.textContent = new Date(startSecs * 1000).toISOString().substr(11, 8).replace(/^00:/, '');
  if (player.src !== src) {
    player.src = src;
    player.load();
  }
  player.currentTime = startSecs;
  player.play();
  panel.classList.add('open');
}

function closeVideoPanel() {
  const panel = document.getElementById('video-panel');
  const player = document.getElementById('video-player');
  panel.classList.remove('open');
  player.pause();
}

// ── DELETE EPISODE ────────────────────────────────────────────────────────────

async function deleteEpisode(episodeId) {
  if (!confirm(`Delete this episode and its video? This cannot be undone.`)) return;
  try {
    const res = await fetch(`/api/delete-episode/${encodeURIComponent(episodeId)}`, { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Delete failed');
    loadStats();
    loadEpisodeList();
    resetApp(false, false);
  } catch(e) {
    alert('Delete failed: ' + e.message);
  }
}

// ── VIDEO EPISODE VIEW ────────────────────────────────────────────────────────

async function openVideoEpisode(videoFilename, title, episodeId) {
  toggleSidebar();

  currentQuery = title;
  chatHistory = [];
  hasResults = true;

  const src = `/api/video/${encodeURIComponent(videoFilename)}`;
  const safeTitle = title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const area = document.getElementById('results-area');
  area.innerHTML = `
    <div style="border-radius:var(--radius-lg);overflow:hidden;margin-bottom:8px;background:#000;line-height:0">
      <video id="inline-video-player" controls playsinline preload="metadata"
        style="width:100%;display:block">
        <source src="${src}" type="video/mp4">
      </video>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px">
      <div class="section-header" style="padding:0">AI Summary</div>
      <button onclick="deleteEpisode('${episodeId}')" style="background:none;border:none;color:var(--label-quaternary);font-size:12px;cursor:pointer;padding:4px 0;font-family:var(--sf)" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--label-quaternary)'">Delete video</button>
    </div>
    <div id="ai-section">
      <div class="ai-card">
        <div style="font-size:15px;font-weight:600;color:var(--label);margin-bottom:10px">${safeTitle}</div>
        <div id="ai-content" class="ai-body"><div class="loading-row"><span class="spinner"></span>Generating summary...</div></div>
      </div>
      <button class="view-transcripts-btn" id="transcripts-toggle" style="display:none" onclick="toggleTranscripts()">
        View Transcript &#8964;
      </button>
      <div class="transcripts-panel" id="transcripts-panel"></div>
      <div id="chat-thread"></div>
    </div>`;
  scrollToTop();

  // Autoplay immediately while still in the user-gesture call stack
  const inlineVid = document.getElementById('inline-video-player');
  if (inlineVid) inlineVid.play().catch(() => {});

  try {
    const res = await fetch(`/api/episode-segments/${encodeURIComponent(episodeId)}`);
    const data = await res.json();
    const results = data.results || [];
    currentResults = results;

    if (results.length > 0) {
      const toggle = document.getElementById('transcripts-toggle');
      if (toggle) {
        toggle.style.display = 'inline-flex';
        toggle.innerHTML = `View Transcript (${results.length}) &#8964;`;
      }
      const transcriptHtml = results.map(r => {
        const playBtn = `<button class="play-btn" onclick="seekInlineVideo(${r.start_secs})">▶ ${r.timestamp}</button>`;
        const dlBtn = `<button class="download-btn" onclick="downloadClip('${videoFilename.replace(/'/g,"\\'")}',${r.start_secs})">↓ Clip</button>`;
        const snippet = r.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return `<div class="result-card">
          <div class="result-meta-row">
            <span class="result-ep">${safeTitle}</span>
            <span style="display:inline-flex;align-items:center;flex-shrink:0">${playBtn}${dlBtn}</span>
          </div>
          <div class="result-text">${snippet}</div>
        </div>`;
      }).join('');
      const panel = document.getElementById('transcripts-panel');
      if (panel) panel.innerHTML = transcriptHtml;

      runAnalysisForVideo(title, results);
    } else {
      const el = document.getElementById('ai-content');
      if (el) el.textContent = 'No transcript available for this video.';
    }
  } catch(e) {
    const el = document.getElementById('ai-content');
    if (el) el.textContent = 'Failed to load transcript.';
  }
}

function seekInlineVideo(secs) {
  const v = document.getElementById('inline-video-player');
  if (!v) return;
  v.currentTime = secs;
  v.play();
  scrollToTop();
}

async function downloadClip(filename, startSecs, duration = 90) {
  const btn = event.currentTarget;
  const orig = btn.innerHTML;
  btn.innerHTML = '…';
  btn.disabled = true;
  try {
    const res = await fetch(`/api/clip/${encodeURIComponent(filename)}?start=${startSecs}&duration=${duration}`);
    if (!res.ok) throw new Error('Failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `clip_${Math.floor(startSecs)}s.mp4`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Clip download failed. Make sure ffmpeg is available on the server.');
  } finally {
    btn.innerHTML = orig;
    btn.disabled = false;
  }
}

async function runAnalysisForVideo(title, results) {
  const el = document.getElementById('ai-content');
  if (!el) return;
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: `Summarize this video: "${title}"`, results: results.slice(0, 20) })
    });
    await consumeStream(res,
      (text) => { el.innerHTML = marked.parse(text); },
      (text) => {
        el.innerHTML = text
          ? marked.parse(text)
          : '<span style="color:var(--label-tertiary)">Could not generate summary.</span>';
        if (text) chatHistory.push({ q: `Summarize: ${title}`, a: text });
      },
      (err) => { el.innerHTML = `<span style="color:var(--label-tertiary)">${err}</span>`; }
    );
  } catch(e) {
    const el2 = document.getElementById('ai-content');
    if (el2) el2.innerHTML = '<span style="color:var(--label-tertiary)">Summary unavailable.</span>';
  }
}

function scrollToBottom() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = s.scrollHeight, 50);
}
function scrollToTop() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = 0, 50);
}

// Keep input above iOS keyboard — resize main-screen to match visual viewport
const mainScreen = document.getElementById('main-screen');
if (window.visualViewport) {
  const onViewport = () => {
    const vv = window.visualViewport;
    mainScreen.style.height = vv.height + 'px';
    mainScreen.style.top = vv.offsetTop + 'px';
  };
  window.visualViewport.addEventListener('resize', onViewport);
  window.visualViewport.addEventListener('scroll', onViewport);
}
// Prevent body scroll — only scroll-area/sidebar should scroll
document.body.addEventListener('touchmove', function(e) {
  if (!e.target.closest('.scroll-area, .sidebar-list')) e.preventDefault();
}, { passive: false });

(async function() {
  try {
    const res = await fetch('/api/stats');
    if (res.ok) {
      const data = await res.json();
      const login = document.getElementById('login-screen');
      const main  = document.getElementById('main-screen');
      login.style.display = 'none';
      main.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
      document.getElementById('ep-count').textContent = data.episodes.toLocaleString();
      document.getElementById('search-input').focus();
    } else {
      const login = document.getElementById('login-screen');
      login.style.opacity = '1';
    }
  } catch(e) {
    document.getElementById('login-screen').style.opacity = '1';
  }
})();
</script>

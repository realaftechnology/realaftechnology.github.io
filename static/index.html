<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AFBrain</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

:root {
  --bg-primary: #000000;
  --bg-secondary: #1c1c1e;
  --bg-tertiary: #2c2c2e;
  --separator: rgba(84,84,88,0.65);
  --red: #ff453a;
  --orange: #ff9f0a;
  --label: #ffffff;
  --label-secondary: rgba(235,235,245,0.6);
  --label-tertiary: rgba(235,235,245,0.3);
  --label-quaternary: rgba(235,235,245,0.16);
  --fill: rgba(120,120,128,0.36);
  --radius: 12px;
  --radius-lg: 16px;
  --sf: -apple-system, 'Helvetica Neue', sans-serif;
  --sf-mono: 'SF Mono', 'Menlo', monospace;
}

html, body {
  background: var(--bg-primary);
  color: var(--label);
  font-family: var(--sf);
  height: 100%;
  font-size: 17px;
  line-height: 1.47;
}

/* ── LOGIN ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: 0 24px;
}
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 40px;
}
.login-logo span { color: var(--red); }
.login-field {
  background: var(--bg-secondary);
  border: none;
  border-radius: var(--radius);
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  padding: 14px 16px;
  width: 100%;
  outline: none;
  margin-bottom: 12px;
  -webkit-appearance: none;
}
.login-field::placeholder { color: var(--label-tertiary); }
.login-btn {
  width: 100%;
  height: 50px;
  background: var(--red);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: var(--sf);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
  transition: opacity 0.15s;
}
.login-btn:active { opacity: 0.8; }
.login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ── MAIN LAYOUT ── */
#main-screen {
  display: none;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
}

/* ── HEADER ── */
.app-header {
  flex-shrink: 0;
  padding: 52px 20px 14px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 1;
  letter-spacing: -0.5px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.app-title:active { opacity: 0.7; }
.app-title span { color: var(--red); }
.ep-badge { font-size: 13px; color: var(--label-secondary); }
.ep-badge strong { color: var(--red); font-weight: 600; }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 0;
  -webkit-overflow-scrolling: touch;
}
.scroll-area::-webkit-scrollbar { width: 0; }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 1px;
  color: var(--label-secondary);
  margin-bottom: 10px;
}
.empty-sub { font-size: 15px; color: var(--label-tertiary); line-height: 1.5; }

/* ── SECTION HEADER ── */
.section-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 4px 0 8px;
}

/* ── AI CARD ── */
.ai-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body {
  font-size: 15px;
  line-height: 1.65;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.ai-body h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--label-tertiary);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin: 14px 0 6px;
}
.ai-body ul, .ai-body ol { padding-left: 20px; }
.ai-body li { margin-bottom: 6px; color: var(--label); }
.ai-body blockquote {
  border-left: 3px solid var(--red);
  padding-left: 12px;
  margin: 10px 0;
  color: var(--label-secondary);
  font-style: italic;
}
.ai-body p { margin-bottom: 8px; }
.ai-body strong { color: var(--label); font-weight: 600; }

/* ── VIEW TRANSCRIPTS BUTTON ── */
.view-transcripts-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 20px;
  color: var(--label-secondary);
  font-family: var(--sf);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  cursor: pointer;
  margin-top: 4px;
  margin-bottom: 8px;
  transition: background 0.15s;
  -webkit-appearance: none;
}
.view-transcripts-btn:hover { background: #3a3a3c; }

/* ── TRANSCRIPTS PANEL ── */
.transcripts-panel { display: none; margin-bottom: 12px; }
.transcripts-panel.open { display: block; }

/* ── CHAT ── */
.chat-item {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-top: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-q-label {
  font-size: 15px;
  line-height: 1.65;
  color: var(--red);
  margin-bottom: 10px;
}
.chat-a-body {
  font-size: 15px;
  line-height: 1.65;
  color: var(--label);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.chat-a-body blockquote { border-left: 3px solid var(--red); padding-left: 12px; margin: 8px 0; font-style: italic; color: var(--label-secondary); }
.chat-a-body p { margin-bottom: 6px; }
.chat-a-body strong { color: var(--label); }
.chat-a-body ul, .chat-a-body ol { padding-left: 20px; }
.chat-a-body li { margin-bottom: 4px; }

/* ── RESULT CARDS ── */
.result-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 8px;
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.result-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
  flex-wrap: wrap;
}
.result-ep {
  font-size: 11px;
  font-weight: 500;
  color: var(--label-tertiary);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  min-width: 0;
}
.result-ts { font-family: var(--sf-mono); font-size: 12px; color: var(--red); flex-shrink: 0; }
.result-speaker { font-size: 11px; color: var(--label-quaternary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
.result-text { font-size: 15px; line-height: 1.55; color: var(--label-secondary); word-wrap: break-word; overflow-wrap: break-word; }
.result-text mark { background: transparent; color: var(--orange); font-weight: 500; }

/* ── BOTTOM INPUT AREA ── */
.input-area {
  flex-shrink: 0;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--separator);
  /* Stays above keyboard on iOS */
  position: sticky;
  bottom: 0;
}
.input-bar {
  display: flex;
  align-items: center;
  background: var(--bg-secondary);
  border-radius: 22px;
  padding: 0 6px 0 16px;
  gap: 8px;
  min-height: 44px;
}
.input-bar input {
  flex: 1;
  background: none;
  border: none;
  color: var(--label);
  font-family: var(--sf);
  font-size: 17px;
  outline: none;
  -webkit-appearance: none;
  min-width: 0;
  padding: 10px 0;
}
.input-bar input::placeholder { color: var(--label-tertiary); }
.input-submit {
  background: var(--red);
  border: none;
  border-radius: 50%;
  color: #fff;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
  transition: opacity 0.15s;
  -webkit-appearance: none;
}
.input-submit:active { opacity: 0.7; }
.input-submit:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--fill);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-row { display: flex; align-items: center; padding: 14px 0; font-size: 14px; color: var(--label-tertiary); }
.scroll-bottom-pad { height: 20px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span>AF</span>BRAIN</div>
    <input class="login-field" type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Continue</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen">

  <div class="app-header">
    <div class="app-title" onclick="resetApp()"><span>AF</span>BRAIN</div>
    <div class="ep-badge"><strong id="ep-count">—</strong> episodes</div>
  </div>

  <div class="scroll-area" id="scroll-area">
    <div id="results-area">
      <div class="empty-state">
        <div class="empty-title">Search Andy's Mind</div>
        <div class="empty-sub">Ask about episodes, predictions, stories, quotes, or any topic Andy has covered.</div>
      </div>
    </div>
    <div class="scroll-bottom-pad"></div>
  </div>

  <div class="input-area">
    <div class="input-bar">
      <input type="text" id="search-input" placeholder="Ask anything...">
      <button class="input-submit" id="main-submit" onclick="handleSubmit()">&#8593;</button>
    </div>
  </div>

</div>

<script>
let currentResults = [];
let chatHistory = [];
let currentQuery = '';
let analyzing = false;
let hasResults = false;

document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw}) });
    if (res.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'flex';
      loadStats();
      document.getElementById('search-input').focus();
    } else {
      err.textContent = 'Incorrect password.';
      document.getElementById('pw-input').value = '';
    }
  } catch(e) { err.textContent = 'Connection error.'; }
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('ep-count').textContent = data.episodes.toLocaleString();
  } catch(e) {}
}

function resetApp() {
  currentResults = []; chatHistory = []; currentQuery = ''; analyzing = false; hasResults = false;
  document.getElementById('search-input').value = '';
  document.getElementById('results-area').innerHTML = `
    <div class="empty-state">
      <div class="empty-title">Search Andy's Mind</div>
      <div class="empty-sub">Ask about episodes, predictions, stories, quotes, or any topic Andy has covered.</div>
    </div>`;
  document.getElementById('search-input').focus();
}

document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });

function handleSubmit() {
  const val = document.getElementById('search-input').value.trim();
  if (!val) return;
  document.getElementById('search-input').value = '';
  if (hasResults) { doFollowup(val); } else { doSearch(val); }
}

async function doSearch(query) {
  currentQuery = query; chatHistory = []; hasResults = false;
  const area = document.getElementById('results-area');
  area.innerHTML = '<div class="loading-row"><span class="spinner"></span>Searching...</div>';
  try {
    const res = await fetch('/api/search', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query}) });
    if (!res.ok) return;
    const data = await res.json();
    currentResults = data.results || [];
    renderResults(query, currentResults);
  } catch(e) {
    area.innerHTML = '<div class="loading-row">Search failed. Try again.</div>';
  }
}

function renderResults(query, results) {
  const area = document.getElementById('results-area');
  if (!results.length) {
    area.innerHTML = `<div class="empty-state"><div class="empty-title">No Results</div><div class="empty-sub">Nothing found for "${query}".</div></div>`;
    return;
  }
  hasResults = true;

  let transcriptHtml = '';
  results.forEach(r => {
    const epShort = r.episode_title.replace(/\.(mp3|mp4|m4a)$/i, '').substring(0, 60);
    const snippet = highlightText(r.text, query);
    const speaker = r.speaker ? `<div class="result-speaker">${r.speaker}</div>` : '';
    transcriptHtml += `<div class="result-card">
      <div class="result-meta-row">
        <span class="result-ep">${epShort}</span>
        <span class="result-ts">${r.timestamp}</span>
      </div>
      ${speaker}
      <div class="result-text">${snippet}</div>
    </div>`;
  });

  let html = `<div class="section-header">AI Analysis</div>
  <div id="ai-section">
    <div class="ai-card">
      <div class="chat-q-label">&ldquo;${query.replace(/"/g, '&quot;')}&rdquo;</div>
      <div id="ai-content" class="ai-body"><div class="loading-row"><span class="spinner"></span>Analyzing transcripts...</div></div>
    </div>
    <button class="view-transcripts-btn" id="transcripts-toggle" onclick="toggleTranscripts()">
      View Transcripts (${results.length}) &#8964;
    </button>
    <div class="transcripts-panel" id="transcripts-panel">${transcriptHtml}</div>
    <div id="chat-thread"></div>
  </div>`;

  area.innerHTML = html;
  scrollToBottom();
  runAnalysis(query, results);
}

function toggleTranscripts() {
  const panel = document.getElementById('transcripts-panel');
  const btn = document.getElementById('transcripts-toggle');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    btn.innerHTML = `Hide Transcripts &#8963;`;
  } else {
    btn.innerHTML = `View Transcripts (${currentResults.length}) &#8964;`;
  }
}

function highlightText(text, query, maxChars=280) {
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 3);
  let bestPos = 0, bestScore = 0;
  const tLower = text.toLowerCase();
  for (let i = 0; i < Math.max(1, text.length - 50); i += 15) {
    const w = tLower.substring(i, i + 200);
    const score = words.filter(w2 => w.includes(w2)).length;
    if (score > bestScore) { bestScore = score; bestPos = i; }
  }
  const start = Math.max(0, bestPos - 30);
  const end = Math.min(text.length, start + maxChars);
  let snippet = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
  snippet = snippet.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  words.forEach(word => {
    const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    snippet = snippet.replace(re, m => `<mark>${m}</mark>`);
  });
  return snippet;
}

async function runAnalysis(query, results) {
  if (analyzing) return;
  analyzing = true;
  try {
    const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query, results}) });
    const data = await res.json();
    const el = document.getElementById('ai-content');
    if (el) {
      el.innerHTML = data.error
        ? `<span style="color:var(--label-tertiary)">${data.error}</span>`
        : marked.parse(data.analysis || '');
      scrollToBottom();
    }
  } catch(e) {
    const el = document.getElementById('ai-content');
    if (el) el.innerHTML = '<span style="color:var(--label-tertiary)">Analysis unavailable.</span>';
  }
  analyzing = false;
}

async function doFollowup(question) {
  const thread = document.getElementById('chat-thread');
  if (!thread) return;
  const itemId = `chat-${Date.now()}`;
  thread.innerHTML += `<div class="chat-item" id="${itemId}">
    <div class="chat-q-label">&ldquo;${question.replace(/"/g, '&quot;')}&rdquo;</div>
    <div class="chat-a-body"><div class="loading-row"><span class="spinner"></span>Searching...</div></div>
  </div>`;
  scrollToBottom();
  try {
    const res = await fetch('/api/followup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({question, history: chatHistory, original_query: currentQuery}) });
    const data = await res.json();
    const answer = data.answer || data.error || 'No response.';
    chatHistory.push({q: question, a: answer});
    const item = document.getElementById(itemId);
    if (item) item.querySelector('.chat-a-body').innerHTML = marked.parse(answer);
    scrollToBottom();
  } catch(e) {
    const item = document.getElementById(itemId);
    if (item) item.querySelector('.chat-a-body').textContent = 'Request failed.';
  }
}

function scrollToBottom() {
  const s = document.getElementById('scroll-area');
  if (s) setTimeout(() => s.scrollTop = s.scrollHeight, 50);
}

// Handle iOS keyboard — scroll area resizes naturally with dvh
// Prevent body scroll so only scroll-area scrolls
document.body.addEventListener('touchmove', function(e) {
  if (!e.target.closest('.scroll-area')) e.preventDefault();
}, { passive: false });

(async function() {
  try {
    const res = await fetch('/api/stats');
    if (res.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'flex';
      const data = await res.json();
      document.getElementById('ep-count').textContent = data.episodes.toLocaleString();
      document.getElementById('search-input').focus();
    }
  } catch(e) {}
})();
</script>
</body>
</html>
